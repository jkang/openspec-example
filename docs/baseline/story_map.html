<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Map - OpenSpec Baseline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc',
                            200: '#e2e8f0',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .prose { max-width: 64rem; margin: 0 auto; padding: 2rem; background: white; border: 1px solid #e2e8f0; }
        * { border-radius: 0 !important; box-shadow: none !important; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: left; }
        th { background-color: #f8fafc; }
        pre { background: #f8fafc; padding: 1rem; border: 1px solid #e2e8f0; overflow-x: auto; }
        .mermaid { margin: 2rem 0; display: flex; justify-content: center; }
    </style>
</head>
<body class="p-8">
    <div class="mb-8 flex items-center justify-between max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-slate-900 border-l-4 border-slate-900 pl-4">Story Map</h1>
        <a href="index.html" class="text-sm text-slate-500 hover:text-slate-900">返回基线列表</a>
    </div>
    
    <article id="content" class="prose border border-slate-200 p-8 bg-white">
        <!-- Content will be rendered here -->
    </article>

    <script>
        const markdown = `# Story Map 基线

## Purpose
展示每个 Journey Step 已经实现的 Story，以及后续 Phase 计划实现的 Story。

## Story Map 矩阵

| Journey Step | Implemented (已实现) | Current Phase (当前阶段) | +1 Month (未来) |
| :--- | :--- | :--- | :--- |
| **商品浏览** | 列表展示, 详情页, 搜索过滤 | 排序功能 | 推荐算法 |
| **购物车管理** | 加购, 修改数量, 用户一致性校验 | - | 组合套装 |
| **营销结算** | 满减券, 折扣券, 最优券推荐 | 叠加使用规则 | 积分抵扣 |
| **订单处理** | 模拟下单, 支付确认, 结算页 UI | 订单导出 | 支付对接 |
| **商品运营** | 基础属性管理, 库存同步 | 分类管理 | 批量导入 |

---
*Last Updated: 2026-08-19*
`;
        
        // Custom renderer to handle mermaid blocks
        const renderer = new marked.Renderer();
        const originalCode = renderer.code.bind(renderer);
        renderer.code = function(code, language, escaped) {
            if (language === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
            }
            return originalCode(code, language, escaped);
        };

        document.getElementById('content').innerHTML = marked.parse(markdown, { renderer: renderer });
        
        mermaid.initialize({ startOnLoad: true, theme: 'neutral' });
    </script>
</body>
</html>
