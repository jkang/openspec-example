<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Model - OpenSpec Baseline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc',
                            200: '#e2e8f0',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .prose { max-width: 64rem; margin: 0 auto; padding: 2rem; background: white; border: 1px solid #e2e8f0; }
        * { border-radius: 0 !important; box-shadow: none !important; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: left; }
        th { background-color: #f8fafc; }
        pre { background: #f8fafc; padding: 1rem; border: 1px solid #e2e8f0; overflow-x: auto; }
        .mermaid { margin: 2rem 0; display: flex; justify-content: center; }
    </style>
</head>
<body class="p-8">
    <div class="mb-8 flex items-center justify-between max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-slate-900 border-l-4 border-slate-900 pl-4">Domain Model</h1>
        <a href="index.html" class="text-sm text-slate-500 hover:text-slate-900">返回基线列表</a>
    </div>
    
    <article id="content" class="prose border border-slate-200 p-8 bg-white">
        <!-- Content will be rendered here -->
    </article>

    <script>
        const markdown = `# Domain Model 基线 (Event-Storming 视角)

## Purpose
基于 DDD 与 Event-Storming 描述系统领域模型，包括关键事件、命令、策略与上下文关系，反映电商系统的完整业务全景。

## 1. Event Storming 全景

### 领域全景可视化 (Context Map)
\`\`\`mermaid
flowchart LR
    subgraph CatalogContext [Catalog - 商品目录]
        Product[(Product Aggregate)]
        Search[Search Service]
    end

    subgraph CartContext [Cart - 购物车]
        Cart[(Cart Aggregate)]
        Validate[Session Validator]
    end

    subgraph CouponContext [Coupon - 营销优惠]
        Coupon[(Coupon Aggregate)]
        Engine[Recommendation Engine]
    end

    subgraph OrderContext [Order - 交易订单]
        Order[(Order Aggregate)]
        Calc[Financial Calculator]
    end

    %% Event Flows
    Search -- "ProductSearched" --> CatalogContext
    CatalogContext -- "StockUpdated" --> CartContext
    CartContext -- "ItemAddedToCart" --> OrderContext
    OrderContext -- "ApplyBestCoupon" --> CouponContext
    CouponContext -- "CouponApplied" --> OrderContext
    OrderContext -- "PaymentConfirmed" --> CatalogContext
    CatalogContext -- "StockDepleted" --> OrderContext
\`\`\`

### 关键 Domain Events (领域事件)
- **Catalog**: \`ProductCreated\`, \`ProductSearched\`, \`StockUpdated\`, \`StockDepleted\`
- **Cart**: \`ItemAddedToCart\`, \`ItemRemovedFromCart\`, \`CartQuantityChanged\`, \`CartCleared\`, \`CartValidated\`
- **Coupon**: \`CouponCreated\`, \`CouponPublished\`, \`CouponApplied\`, \`CouponRecommendationGenerated\`
- **Order**: \`OrderPlaced\`, \`OrderPaymentConfirmed\`, \`OrderCancelled\`, \`OrderStockDeducted\`, \`FinancialCalculationCompleted\`

### 核心 Commands (指令)
- **Catalog**: \`CreateProduct\`, \`SearchProduct\`, \`UpdateStock\`, \`SyncInventory\`
- **Cart**: \`AddToCart\`, \`RemoveFromCart\`, \`UpdateQuantity\`, \`ValidateCart\`
- **Coupon**: \`ApplyBestCoupon\`, \`ValidateCouponThreshold\`, \`ReleaseCoupon\`
- **Order**: \`PlaceOrder\`, \`ConfirmPayment\`, \`CancelOrder\`, \`CalculateFinalPrice\`

## 2. Bounded Contexts (限额上下文)

- **Catalog (商品目录)**: 负责商品元数据管理、基于关键词的搜索引擎以及库存的原子操作。
- **Cart (购物车)**: 维护用户选购状态，核心策略是“Session 一致性”，确保购物车数据不被非法篡改。
- **Order (订单)**: 交易核心上下文，管理订单生命周期、财务精度计算 (\`actualPaidCents\`) 以及与支付系统的交互。
- **Coupon (营销优惠)**: 营销引擎，支持 \`FLAT\` 与 \`PERCENTAGE\` 折扣策略，核心能力是“智能最优推荐”。

## 3. 核心 Aggregate 与 Entity

### Catalog Aggregate
- **Root Entity**: \`Product\` (id, name, description, priceCents, stock, categoryId)
- **Value Objects**: \`Price\` (cents 封装), \`StockStatus\`

### Cart Aggregate
- **Root Entity**: \`Cart\` (userId, sessionId, items, lastUpdatedAt)
- **Entities**: \`CartItem\` (productId, quantity, unitPriceCents)

### Order Aggregate
- **Root Entity**: \`Order\` (id, userId, status, totalCents, discountCents, actualPaidCents, couponId)
- **Entities**: \`OrderItem\` (productId, priceCents, quantity)
- **Value Objects**: \`FinancialPrecision\` (含 +0.00001 补偿逻辑)

### Coupon Aggregate
- **Root Entity**: \`Coupon\` (id, code, type: FLAT/PERCENTAGE, value, minSpendCents, status)

---
*Last Updated: 2026-08-20*
`;
        
        // Render markdown and then post-process mermaid blocks for better stability
        document.getElementById('content').innerHTML = marked.parse(markdown);
        
        document.querySelectorAll('pre code.language-mermaid').forEach(el => {
            const pre = el.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = el.textContent;
            pre.replaceWith(div);
        });

        mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
        mermaid.init(undefined, '.mermaid');
    </script>
</body>
</html>
