# OpenSpec SDD Execution Engine Configuration (v2.0)
schema: spec-driven

# 全局上下文注入
context: |
  项目: ecommerce-mini - 一个展示 OpenSpec 规范驱动开发 (SDD) 的极简电商系统。
  治理文档 (唯一事实来源):
    - 流程 SOP: docs/SOPS/SDD_WORKFLOW.md (分支流转与指令规范)
    - 产品感: docs/PRODUCT_SENSE.md (Elevator Pitch 与业务导向)
    - 产品路线图: docs/ROADMAP.md (当前阶段目标与 Explore 边界)
    - 前端规范: docs/FRONTEND.md (极简 UI 约束与浏览器验证闭环)
    - 后端架构: docs/ARCHITECTURE.md (Node.js/Python 四层架构设计)
    - 测试策略: docs/TESTING_STRATEGY.md (BDD 标签与 Cucumber E2E 规范)
    - 质量标准: docs/QUALITY_SCORE.md (交付底线)

# 规划层文档引用 (v2.0 治理护栏)
planning:
  product_sense: docs/PRODUCT_SENSE.md
  roadmap: docs/ROADMAP.md
  journey: docs/baseline/high_level_journey.html
  story_map: docs/baseline/service_blueprint.html
  process_flow: docs/baseline/business_process.html
  domain_model: docs/baseline/domain_model.html

rules:
  explore:
    - 必须严格遵循 docs/SOPS/SDD_WORKFLOW.md 中的“结构化 6 步法”
    - 必须包含 Roadmap Alignment (规划对齐) 校验，参考 docs/ROADMAP.md
    - 必须参考 docs/baseline/domain_model.html 识别 Impacted Bounded Contexts 与 Candidate Capabilities
    - 必须确认任务类型 (Epic/Story/Bug Fix/Tech Debt)
    - 对于 Epic 类型，必须在 openspec/ 目录下创建 epic-<key>.story-list.json
    - 必须输出 ideas/idea.md 作为后续提案的唯一源头
  proposal:
    - 基于已确认的 idea.md 结论，明确说明 Why 和 What
    - 包含映射到 spec 文件夹名称的 Capabilities 章节，且必须与 Domain Model 映射对齐
    - 必须说明受影响的实现版本 (Node.js / Python / Frontend / 全部)
    - 说明后续流程分支（是否跳过 Prototype 或 Specs）
  prototype:
    - 必须严格遵循 docs/FRONTEND.md 的 UI 规范
    - 现代扁平化：禁止圆角 (rounded-none)、禁止阴影 (shadow-none)、禁止装饰性 Emoji
    - 颜色方案：使用 slate 色系 (slate-50 背景, slate-200 边框, slate-900 强调色)
    - 数据要求：严禁使用空洞模板（foo/test），必须填充真实的业务数据示例
    - 交互界面：必须完全使用中文
    - 技术实现：使用 Vue 3 (CDN) + Tailwind CSS (CDN) 的可交互 HTML
  story:
    - 必须作为业务评审的 Single Source of Truth
    - Tech Debt 通常跳过此阶段
    - 如果涉及 UI 变更，必须在 prototype.html 确认后生成，并显式链接原型
    - 验收标准必须覆盖端到端 (E2E) 旅程，使用 Given/When/Then 格式
    - 必须包含业务规则表 (Business Rules)
    - 必须链接到 proposal.md 及其对应的 capability specs
  specs:
    - 所有场景使用 Given/When/Then (Gherkin) 格式
    - 必须从 prototype.html 中提取交互逻辑记录为 Scenario
    - 必须按照 docs/TESTING_STRATEGY.md 打上测试标签 (@unit, @api, @e2e)
    - 如果存在 story.md，必须与 story.md 定义的 E2E 旅程保持逻辑一致
    - 规范性需求语言使用 SHALL 或 MUST
  design:
    - 包含架构图 (Mermaid 或 ASCII)
    - 对于 Bug Fix，必须包含根本原因分析 (RCA)
    - 对于前端，包含 UI 组件层级和状态管理方案 (必须与确认后的 prototype 完全对齐)
    - 记录关键决策及其理由和考虑过的替代方案
  tasks:
    - 指出每个任务适用于哪个实现版本 (Node.js / Python / Frontend / 全部)
    - 包含全链路验证 (E2E) 任务，明确执行 init.sh 中的测试入口
    - 按依赖关系排序任务，确保测试覆盖
  archive:
    - 归档后必须更新对应的 epic-*.story-list.json 状态
    - 如果 Epic 下所有 Story 已完成，必须删除该 story-list.json 文件
