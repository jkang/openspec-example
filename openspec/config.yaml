schema: spec-driven
schemas_dir: schemas

# === v1.8.0: Store 指针 (可选) ===
# 当规划需要跨多个代码仓库时，可将规划集中在一个独立的 store 仓库中。
# store: team-plans

# === v1.8.0: 引用其他 store (可选) ===
# 声明本仓库依赖的其他 store（只读上下文）。
# references:
#   - platform-reqs

context: |
  项目: ecommerce-mini - 一个展示 OpenSpec 规范驱动开发 (SDD) 的极简电商系统。
  治理文档 (唯一事实来源):
    - 流程 SOP: docs/sops/sdd-workflow.md (分支流转与指令规范)
    - 产品路线图: docs/ROADMAP.md (当前阶段目标与 Explore 边界)
    - 前端规范: docs/FRONTEND.md (极简 UI 约束与浏览器验证闭环)
    - 后端架构: docs/ARCHITECTURE.md (Node.js/Python 四层架构设计)
    - 测试策略: docs/TESTING_STRATEGY.md (BDD 标签与 Cucumber E2E 规范)
    - 质量标准: docs/QUALITY_SCORE.md (交付底线)
  多技术栈实现: Node.js (v20+, 零 npm 依赖), Python (FastAPI + Pydantic), 以及 Vue (Vite + Vue 3)。
  架构: 后端采用分层架构 (HTTP -> Service -> Domain -> Repository), 前端采用基于组件的架构。
  存储: 开发环境使用内存 Map, 生产环境使用基于文件的 JSON 持久化 (仅限 Node.js)。
  API: 基于原生 Node.js http 模块 / FastAPI 的 RESTful JSON 接口。
  代码路径:
    - ecommerce/ecommerce-mini/ (Node.js)
    - ecommerce/ecommerce-mini-python/ (Python)
    - ecommerce/ecommerce-mini-frontend/ (Vue 前端)

rules:
  explore:
    - 必须严格遵循 docs/sops/sdd-workflow.md 中的“结构化 6 步法”
    - 必须确认任务类型 (Epic/Feature/Bug Fix/Tech Debt)
    - 对于 Epic 类型，必须在 openspec/ 目录下创建 epic-<key>.feature-list.json
    - 必须输出 ideas/idea.md 作为后续提案的唯一源头
  proposal:
    - 基于已确认的 idea.md 结论，明确说明 Why 和 What
    - 包含映射到 spec 文件夹名称的 Capabilities 章节
    - 必须说明受影响的实现版本 (Node.js / Python / Frontend / 全部)
    - 说明后续流程分支（是否跳过 Prototype 或 Specs）
  prototype:
    - 必须严格遵循 docs/FRONTEND.md 的 UI 规范
    - 现代扁平化：禁止圆角 (rounded-none)、禁止阴影 (shadow-none)、禁止装饰性 Emoji
    - 颜色方案：使用 slate 色系 (slate-50 背景, slate-200 边框, slate-900 强调色)
    - 数据要求：严禁使用空洞模板（foo/test），必须填充真实的业务数据示例
    - 交互界面：必须完全使用中文
    - 技术实现：使用 Vue 3 (CDN) + Tailwind CSS (CDN) 的可交互 HTML
  specs:
    - 所有场景使用 Given/When/Then (Gherkin) 格式
    - 必须从 prototype.html 中提取交互逻辑记录为 Scenario
    - 必须按照 docs/TESTING_STRATEGY.md 打上测试标签 (@unit, @api, @e2e)
    - 规范性需求语言使用 SHALL 或 MUST
  design:
    - 包含架构图 (Mermaid 或 ASCII)
    - 对于 Bug Fix，必须包含根本原因分析 (RCA)
    - 对于前端，包含 UI 组件层级和状态管理方案 (必须与确认后的 prototype 完全对齐)
    - 记录关键决策及其理由和考虑过的替代方案
  tasks:
    - 指出每个任务适用于哪个实现版本 (Node.js / Python / Frontend / 全部)
    - 包含全链路验证 (E2E) 任务，明确执行 init.sh 中的测试入口
    - 按依赖关系排序任务，确保测试覆盖
  archive:
    - 归档后必须更新对应的 epic-*.feature-list.json 状态
    - 如果 Epic 下所有 Feature 已完成，必须删除该 feature-list.json 文件
