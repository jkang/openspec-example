name: spec-driven
version: 2
description: OpenSpec 交付侧工作流 - 提案 (proposal) → 原型 (prototype，可选) → 规范 (specs) → 设计 (design) → 任务 (tasks) → 验证 (verify)。需求侧（req-sdd）已完成探索/业务评审，开发侧从 proposal 起步。
artifacts:
  - id: proposal
    generates: proposal.md
    description: 概述变更内容的初始提案文档
    template: proposal.md
    instruction: |
      创建提案文档，明确说明为什么需要进行此项变更。

      **来源**：
      - **handoff 场景**（需求侧 Epic Story）：由 `/req:handoff` 基于需求侧 `story.md` 合成（Why ← 用户场景；What ← 范围；Capabilities ← idea 候选 Capabilities；Alignment ← 治理映射；Impact ← 架构影响），链接需求侧 story.md 作为业务评审依据。开发侧不重复探索/评审。
      - **直走交付侧场景**（Bug Fix / Tech Debt / 简单功能修改）：直接基于用户输入/当前需求创建提案，不经过独立探索阶段。

      **流程分支控制**：如果是 Bug Fix 或 Tech Debt，请在提案中明确说明后续可能跳过原型 (Prototype) 并在 `.openspec.yaml` 中标记 `skip_specs: true`（若适用）。

      章节结构（**必须使用 `##` 标题级别**，与 `openspec/templates/proposal.md` 模板和 archive 校验器期望一致）：
      - **`## Why (背景原因)`**: 用 1-2 句话说明要解决的问题或抓住的机遇。这解决了什么问题？为什么现在要做？
      - **`## What Changes (变更内容)`**: 使用项目符号列出具体的变更点。明确说明新增功能、修改点或移除的内容。对于破坏性变更，请标记为 **BREAKING**。
      - **`## Capabilities (系统能力)`**: 明确指出将要创建或修改哪些规范 (specs)：
        - **映射对齐约束**：此处列出的 Capabilities 必须与 `docs/baseline/domain_model.html` 中的映射表对齐。如果 proposal 写了一个未映射的 capability，你必须显式说明这是"新增 taxonomy"及其理由。
        - **边界引用约束**：必须显式列出受影响的 `Bounded Contexts`，说明每个 capability 归属到哪个治理边界。
        - **流程对齐约束 (Process Alignment)**: 必须明确列出本次变更受影响的流程节点 ID (来自 `business_process.html`)。
        - **蓝图对齐约束 (Service Blueprint Alignment)**: 必须明确列出本次变更受影响的服务蓝图节点 ID (来自 `service_blueprint.html`)，至少包含 `SB-STAGE-*` 与 `SB-<LANE>-*` 引用，并说明本次是新增、修改还是复用既有蓝图结构。
        - **新增能力 (New Capabilities)**: 列出引入的新能力。每个新能力将生成一个新的 `specs/<capability-path>/spec.md`。新增的路径片段必须使用烤串命名法（kebab-case，例如 `user-auth` 或 `identity/user-auth`），并遵循项目现有的规范组织结构。
        - **修改能力 (Modified Capabilities)**: 列出需求 (REQUIREMENTS)发生变化的现有能力。只有在规范级别的行为发生变化时才包含在此处（不仅仅是实现细节的改变）。每个被修改的能力都需要一个增量规范文件。必须使用 `openspec/specs/` 下完全相同的现有路径。如果没有需求变更，请留空。
      - **`## Impact (影响范围)`**: 受影响的代码、API、依赖项或系统模块。

      重要提示：Capabilities (系统能力) 章节至关重要。它构成了提案阶段与规范阶段之间的契约。在填写此部分之前，请务必研究现有的规范。
      此处列出的每个能力都需要对应一个规范文件。

      每次变更必须至少声明一个能力（新增或修改），或者明确选择跳过规范生成：除非变更的 `.openspec.yaml` 设置了 `skip_specs: true`，否则 `openspec validate` 将拒绝零增量的变更。只有当规范级别的行为没有变化（如纯重构、工具链更改、文档更新）时，才使用 `skip_specs: true` - 规范描述的是系统行为，如果行为没变，规范也不应该改变。
      切勿为了通过验证而捏造需求。

      保持简明扼要（1-2 页）。重点关注"为什么要做 (why)"，而不是"怎么做 (how)" - 具体的实现细节应放在 design.md 中。

      这是整个流程的基础 - 后续的 specs、design 和 tasks 都将以此为基础。
    requires: []

  - id: prototype
    generates: "prototypes/**/*.html"
    description: 用于前端验证的交互式 UI/UX 原型
    template: prototype.html
    instruction: |
      调用 `prototype` 技能（交付侧 `opsx/prototype`）为提案中定义的系统能力创建一个交互式的 HTML 原型。

      在进入技术设计阶段之前，该原型将作为 UI/UX 设计的唯一事实来源 (Single Source of Truth)。

      **流程分支控制**：
      - 如果变更不涉及前端 UI（如 Tech Debt、纯后端 Bug Fix），请直接跳过此阶段。
      - **handoff 场景**：需求侧 Epic Story 的原型已在需求侧完成（`/req:prototype`，Epic 整体），开发侧不重复制作。
      - 为每个涉及前端变更的能力创建一个 HTML 文件：输出路径使用 `prototypes/<capability-path>.html`。
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: 针对此次变更的详细行为规范
    template: spec.md
    instruction: |
      创建规范文件，明确定义系统应该做什么 (WHAT)。

      规范 (spec) 是一份行为契约，而不是实现计划。
      
      **流程分支控制**：
      - 如果任务类型是 Tech Debt 且无外部行为变更，通常在 `.openspec.yaml` 中设置 `skip_specs: true` 并跳过此阶段。
      - 如果任务类型是 Bug Fix，规范重点在于使用 `MODIFIED Requirements` 修正现有行为的描述。
      - **重要**：如果该能力涉及 UI 变更，你必须先参考已生成的 `prototype.html`，提取交互场景并将其嵌入规范中。
      - **重要**：每个能力规范必须包含 `Governance Mapping`，显式引用 `docs/baseline/domain_model.html` 中的 `Bounded Context` 与 capability taxonomy。
      **重要**：每个能力规范必须注明其对应的流程节点 ID（尤其是 `L3` 规则流节点）。
      **重要**：每个能力规范必须注明其关联的服务蓝图节点 ID（至少包含 `SB-STAGE-*` 与 `SB-<LANE>-*`）。
      **重要**：若为 handoff 场景（需求侧 Epic Story），须参考 proposal 中链接的需求侧 `story.md` 的 E2E 验收标准，确保模块规范与之保持一致。

      优秀的规范内容应包含：
      - 用户或下游系统所依赖的可观察行为
      - 输入、输出以及错误处理条件
      - 可以被测试或明确验证的场景 (Scenarios)

      在规范中应避免：
      - 内部类名或函数名
      - 具体的库或框架选择
      - 逐步的实现细节

      为提案的 Capabilities 章节中列出的每个能力创建一个规范文件。
      `<capability-path>` 是相对于 `specs/` 的目录路径。

      增量操作（使用 ## 标题级别）：
      - **ADDED Requirements (新增需求)**: 全新的系统能力
      - **MODIFIED Requirements (修改需求)**: 变更的系统行为
      - **REMOVED Requirements (移除需求)**: 废弃的功能
      - **RENAMED Requirements (重命名需求)**: 仅修改名称

      需求格式要求：
      - 每个需求：使用 `### Requirement: <name>`
      - 每个场景：使用 `#### Scenario: <name>`，并采用 WHEN/THEN 格式
      - **严重警告**：场景 (Scenarios) 必须严格使用 4 个井号 (`####`)。

      关于原型的特别要求：
      - 如果涉及前端变更，你必须从 `prototype.html` 中提取交互逻辑，并使用 `<details>` 标签将原型代码完整嵌入规范。

    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含具体实现细节的技术设计文档
    template: design.md
    instruction: |
      创建技术设计文档，解释如何 (HOW) 实现此次变更。

      **强制要求**：必须在 `proposal.md`、`prototype.html` (若涉及UI) 和 `specs/*.md` (若涉及行为变更) 均已准备就绪后方可开始。

      何时需要包含 design.md：
      - 跨模块变更、引入新依赖、或重大数据模型变更。
      - **Bug Fix**: 需要进行根本原因分析 (Root Cause Analysis)。
      - **Tech Debt**: 需要说明重构方案。

      章节结构：
      - **Context (上下文)**: 引用提案，不要赘述。
      - **Domain Boundary Impact (领域边界影响)**: 必须明确说明此次变更的 capabilities 为什么归属于对应的 Bounded Contexts，参考 `domain_model.html`。
      - **Process Delta (流程影响)**: 描述本次变更对 L2/L3 流程节点的改动或补齐情况。
      - **Service Blueprint Sync Assessment (服务蓝图同步评估)**: 必须明确判断 `sync` 阶段是否需要回写 `docs/baseline/service_blueprint.html`；如果需要，写清触发项（如阶段覆盖、泳道能力分布、能力状态、横切支撑变化）与计划更新部位；如果不需要，也要写清理由。
      - **Domain Model Sync Assessment (领域模型同步评估)**: 必须明确判断 `sync` 阶段是否需要回写 `docs/baseline/domain_model.html`；如果需要，写清触发项（如边界映射、事件、命令、状态机、对象关系、不变量变化）与计划更新部位；如果不需要，也要写清理由。
      - **Goals / Non-Goals**: 仅添加设计层面的边界。
      - **Decisions (技术决策)**: 关键技术选择及其理由。
      - **Risks / Trade-offs**: 已知限制与缓解措施。
      - **Open Questions**: 真正的未知事项。

    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 包含可追踪任务的实施清单
    template: tasks.md
    instruction: |
      创建任务列表，将实施工作进行详细拆解。

      **重要提示：请严格遵循下方模板。** 必须使用 `- [ ]` 格式。

      指南：
      - 在带编号的 ## 标题下对相关任务进行分组
      - 任务粒度应足够小
      - 按照依赖关系排序
      - **E2E 优先**：必须包含跨端全链路验证任务。

      参考 specs 了解要做什么，参考 design 了解如何构建。
    requires:
      - design

  - id: verify
    generates: verify.md
    description: 实施验证报告，包含自动化测试结果与人工验收证据
    template: verify.md
    instruction: |
      在实施 (apply) 过程中及完成后，记录验证证据。

      **强制要求**：
      - 必须包含 Hard Gates (编译通过、单测通过、集成测试通过) 的 PASS 证据。
      - 如果跳过某些测试（如 E2E），必须在报告中说明原因。
      - 所有的验证证据必须对应 `tasks.md` 中的验证项。
    requires:
      - tasks

apply:
  requires: [tasks, verify]
  tracks: tasks.md
  instruction: |
    阅读上下文文件，逐个处理待完成的任务，完成后标记为已完成。

    **关键动作**：
    - 在任务勾选前，必须运行对应的验证命令。
    - 所有的验证结果必须实时记录在 `verify.md` 中。
    - 只有当 `verify.md` 中的 Hard Gates 全部为 PASS 时，方可认为变更实施完成。
