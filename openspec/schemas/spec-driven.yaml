name: spec-driven
version: 1
description: 包含交互式原型验证的 OpenSpec 工作流 - 探索 (explore) → 提案 (proposal) → 原型 (prototype) → 业务评审 (story) → 规范 (specs) → 设计 (design) → 任务 (tasks)
artifacts:
  - id: explore
    generates: ideas/idea.md
    description: 结构化探索文档，记录业务意图、设计思路及架构分析结论
    template: idea.md
    instruction: |
      你必须执行 `/opsx:explore` 流程，通过“结构化 6 步法”与用户达成共识。
      严禁跳过探索阶段直接进入提案。
      
      在变更目录下的 `ideas/idea.md` 中记录以下结论：
      1. **澄清业务意图**：目的、范围、具体业务要求。
      2. **业务设计思路**：逻辑流转、用户价值。
      3. **任务类型与后续策略**：必须与用户确认这是 Epic, Story, Bug Fix 还是 Tech Debt，并制定对应的流程策略。
      4. **需求拆分建议**：是否需要分阶段实施。
      5. **架构影响分析**：现有架构改动点、技术挑战。
      6. **确认结论**：用户已确认的最终意图。

      该文档是后续所有产物的源头，未完成此文档前不得开始 `proposal`。
    requires: []

  - id: proposal
    generates: proposal.md
    description: 概述变更内容的初始提案文档
    template: proposal.md
    instruction: |
      创建提案文档，明确说明为什么需要进行此项变更。
      
      **强制要求**：本提案必须基于已确认的 `ideas/idea.md` 中的结论。如果你发现 `idea.md` 缺失或内容不完整，请立即停止并引导用户执行 `/opsx:explore`。
      **流程分支控制**：检查 `idea.md` 中的“任务类型”。如果是 Epic，则提案应聚焦于拆解后的子功能；如果是 Bug Fix 或 Tech Debt，请在提案中明确说明后续可能跳过原型 (Prototype) 并在 `.openspec.yaml` 中标记 `skip_specs: true`（若适用）。

      章节结构：
      - **Why (背景原因)**: 用 1-2 句话说明要解决的问题或抓住的机遇。这解决了什么问题？为什么现在要做？
      - **What Changes (变更内容)**: 使用项目符号列出具体的变更点。明确说明新增功能、修改点或移除的内容。对于破坏性变更，请标记为 **BREAKING**。
      - **Capabilities (系统能力)**: 明确指出将要创建或修改哪些规范 (specs)：
        - **新增能力 (New Capabilities)**: 列出引入的新能力。每个新能力将生成一个新的 `specs/<capability-path>/spec.md`。新增的路径片段必须使用烤串命名法（kebab-case，例如 `user-auth` 或 `identity/user-auth`），并遵循项目现有的规范组织结构。
        - **修改能力 (Modified Capabilities)**: 列出需求 (REQUIREMENTS)发生变化的现有能力。只有在规范级别的行为发生变化时才包含在此处（不仅仅是实现细节的改变）。每个被修改的能力都需要一个增量规范文件。必须使用 `openspec/specs/` 下完全相同的现有路径。如果没有需求变更，请留空。
      - **Impact (影响范围)**: 受影响的代码、API、依赖项或系统模块。

      重要提示：Capabilities (系统能力) 章节至关重要。它构成了提案阶段与规范阶段之间的契约。在填写此部分之前，请务必研究现有的规范。
      此处列出的每个能力都需要对应一个规范文件。

      每次变更必须至少声明一个能力（新增或修改），或者明确选择跳过规范生成：除非变更的 `.openspec.yaml` 设置了 `skip_specs: true`，否则 `openspec validate` 将拒绝零增量的变更。只有当规范级别的行为没有变化（如纯重构、工具链更改、文档更新）时，才使用 `skip_specs: true` - 规范描述的是系统行为，如果行为没变，规范也不应该改变。
      切勿为了通过验证而捏造需求。

      保持简明扼要（1-2 页）。重点关注“为什么要做 (why)”，而不是“怎么做 (how)” - 具体的实现细节应放在 design.md 中。

      这是整个流程的基础 - 后续的 specs、design 和 tasks 都将以此为基础。
    requires:
      - explore

  - id: prototype
    generates: "prototypes/**/*.html"
    description: 用于前端验证的交互式 UI/UX 原型
    template: prototype.html
    instruction: |
      调用 `openspec-prototype` 技能为提案中定义的系统能力创建一个交互式的 HTML 原型。
      
      在进入技术设计阶段之前，该原型将作为 UI/UX 设计的唯一事实来源 (Single Source of Truth)。
      
      **流程分支控制**：
      - 如果 `idea.md` 中的任务类型是 Tech Debt，或是不涉及前端 UI 变更的 Bug Fix，请直接跳过此阶段。
      - 为每个涉及前端变更的能力创建一个 HTML 文件：输出路径使用 `prototypes/<capability-path>.html`。
    requires:
      - proposal

  - id: story
    generates: story.md
    description: 业务评审文档，包含 E2E 验收标准与用户场景
    template: story.md
    instruction: |
      调用 `openspec-story` 技能生成业务评审 Story 文档。
      
      **流程分支控制**：
      - 如果任务类型是 Tech Debt，通常跳过此阶段。
      - 如果涉及前端 UI 变更，必须在 `prototype.html` 已生成并确认后执行。

      **内容要求**：
      - 该文档用于业务评审，必须包含端到端的验收标准 (Given/When/Then)。
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: 针对此次变更的详细行为规范
    template: spec.md
    instruction: |
      创建规范文件，明确定义系统应该做什么 (WHAT)。

      规范 (spec) 是一份行为契约，而不是实现计划。
      
      **流程分支控制**：
      - 如果任务类型是 Tech Debt 且无外部行为变更，通常在 `.openspec.yaml` 中设置 `skip_specs: true` 并跳过此阶段。
      - 如果任务类型是 Bug Fix，规范重点在于使用 `MODIFIED Requirements` 修正现有行为的描述。
      - **重要**：如果该能力涉及 UI 变更，你必须先参考已生成的 `prototype.html`，提取交互场景并将其嵌入规范中。
      - **重要**：如果任务类型不是 Tech Debt，必须参考已确认的 `story.md`，确保模块规范与 E2E 验收标准保持一致。

      优秀的规范内容应包含：
      - 用户或下游系统所依赖的可观察行为
      - 输入、输出以及错误处理条件
      - 可以被测试或明确验证的场景 (Scenarios)

      在规范中应避免：
      - 内部类名或函数名
      - 具体的库或框架选择
      - 逐步的实现细节

      为提案的 Capabilities 章节中列出的每个能力创建一个规范文件。
      `<capability-path>` 是相对于 `specs/` 的目录路径。

      增量操作（使用 ## 标题级别）：
      - **ADDED Requirements (新增需求)**: 全新的系统能力
      - **MODIFIED Requirements (修改需求)**: 变更的系统行为
      - **REMOVED Requirements (移除需求)**: 废弃的功能
      - **RENAMED Requirements (重命名需求)**: 仅修改名称

      需求格式要求：
      - 每个需求：使用 `### Requirement: <name>`
      - 每个场景：使用 `#### Scenario: <name>`，并采用 WHEN/THEN 格式
      - **严重警告**：场景 (Scenarios) 必须严格使用 4 个井号 (`####`)。

      关于原型的特别要求：
      - 如果涉及前端变更，你必须从 `prototype.html` 中提取交互逻辑，并使用 `<details>` 标签将原型代码完整嵌入规范。

    requires:
      - proposal

  - id: design
    generates: design.md
    description: 包含具体实现细节的技术设计文档
    template: design.md
    instruction: |
      创建技术设计文档，解释如何 (HOW) 实现此次变更。

      **强制要求**：必须在 `proposal.md`、`prototype.html` (若涉及UI) 和 `specs/*.md` (若涉及行为变更) 均已准备就绪后方可开始。

      何时需要包含 design.md：
      - 跨模块变更、引入新依赖、或重大数据模型变更。
      - **Bug Fix**: 需要进行根本原因分析 (Root Cause Analysis)。
      - **Tech Debt**: 需要说明重构方案。

      章节结构：
      - **Context (上下文)**: 引用提案，不要赘述。
      - **Goals / Non-Goals**: 仅添加设计层面的边界。
      - **Decisions (技术决策)**: 关键技术选择及其理由。
      - **Risks / Trade-offs**: 已知限制与缓解措施。
      - **Open Questions**: 真正的未知事项。

    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: 包含可追踪任务的实施清单
    template: tasks.md
    instruction: |
      创建任务列表，将实施工作进行详细拆解。

      **重要提示：请严格遵循下方模板。** 必须使用 `- [ ]` 格式。

      指南：
      - 在带编号的 ## 标题下对相关任务进行分组
      - 任务粒度应足够小
      - 按照依赖关系排序
      - **E2E 优先**：必须包含跨端全链路验证任务。

      参考 specs 了解要做什么，参考 design 了解如何构建。
    requires:
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    阅读上下文文件，逐个处理待完成的任务，完成后标记为已完成。
