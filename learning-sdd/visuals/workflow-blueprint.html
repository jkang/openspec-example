<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpec 蓝图级分层治理体系全景图</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        aidd: {
                            green: '#00b96b',
                            blue: '#1677ff',
                            slate: '#1e293b',
                            gray: '#94a3b8',
                            light: '#f8fafc',
                            red: '#be123c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #eef2f7;
            color: #1e293b;
            font-family: 'system-ui', sans-serif;
        }
        .slide-container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .slide {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: white;
            box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.18);
            margin-bottom: 56px;
            display: flex;
            flex-direction: column;
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .slide-header {
            padding: 20px 34px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .bp-body {
            flex: 1;
            min-height: 0;
            padding: 14px 8px;
        }
        .bp-body.with-legend {
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }
        .bp-body.with-legend .bp-svg {
            min-height: 0;
            height: 100%;
        }
        .bp-legend {
            border-top: 1px solid #eef2f7;
            padding-top: 6px;
            color: #64748b;
            font-size: 8.5px;
            line-height: 1.3;
            letter-spacing: 0.01em;
        }
        .bp-legend .legend-line {
            display: inline-block;
            width: 18px;
            height: 0;
            border-top-width: 2px;
            vertical-align: middle;
        }
        .bp-legend .legend-solid {
            display: inline-block;
            width: 18px;
            height: 2px;
            background: #94a3b8;
            vertical-align: middle;
        }
        .bp-legend .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .bp-legend .legend-group {
            flex: 0 0 30px;
            width: 30px;
            padding-top: 1px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 7.5px;
            font-weight: 900;
            letter-spacing: 0.08em;
            color: #94a3b8;
        }
        .bp-legend .legend-desc { color: #64748b; }
        .bp-legend .legend-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 12px;
            padding: 0 5px;
            border-radius: 999px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            font-weight: 900;
            letter-spacing: 0.02em;
            line-height: 1;
        }
        .legend-badge.must { background: #ecfdf3; color: #008a52; border: 1px solid #86efac; }
        .legend-badge.opt { background: #ffffff; color: #64748b; border: 1px dashed #cbd5e1; }
        .legend-badge.ifui { background: #eff6ff; color: #1677ff; border: 1px solid #bfdbfe; }
        .legend-badge.epic { background: #eef2f7; color: #1e293b; border: 1px solid #cbd5e1; }
        .legend-badge.hitl { background: #f59e0b; color: #ffffff; border: 1px solid #f59e0b; }
        .legend-badge.gate { background: #ffffff; color: #8a3b4a; border: 1px solid #9f4a5a; }
        .bp-svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .bp-svg text {
            font-family: 'system-ui', -apple-system, sans-serif;
        }
        .bp-svg .mono { font-family: 'JetBrains Mono', monospace; }
        .bp-svg .serif { font-family: '"Noto Serif SC"', serif; }
    </style>
</head>
<body>

    <div class="slide-container" id="slides"></div>

    <footer class="py-16 text-center">
        <p class="text-slate-400 font-mono text-xs tracking-[0.3em] uppercase">
            Spec-Driven Development · Governance Framework V2.0 · AIDD City Lab
        </p>
    </footer>

    <script>
    // ==========================================================================
    //  5-Lane Blueprint SVG generator — single viewBox ⇒ guaranteed alignment.
    // ==========================================================================

    const C = {
        green: '#00b96b',
        blue:  '#1677ff',
        slate: '#1e293b',
        gray:  '#94a3b8',
        red:   '#9f4a5a',
        amber: '#d97706',
        teal:  '#0d9488',
    };

    const TONE = {
        must: { fill: '#e9f8f0', stroke: '#00b96b', text: '#008a52' },
        opt:  { fill: '#ffffff', stroke: '#94a3b8', text: '#64748b', dash: '3 3' },
        ifui: { fill: '#eaf2ff', stroke: '#1677ff', text: '#1677ff' },
        epic: { fill: '#eef2f7', stroke: '#1e293b', text: '#1e293b' },
        hitl: { fill: '#f59e0b', stroke: '#f59e0b', text: '#ffffff' },
        gate: { fill: '#ffffff', stroke: '#9f4a5a', text: '#8a3b4a' },
        auto: { fill: '#f1f5f9', stroke: '#cbd5e1', text: '#64748b' },
    };

    // Vertical bands (viewBox units) — flow lane is tall so loops stay INSIDE it
    const LANE = {
        agent:   { top: 8,   h: 50 },
        flow:    { top: 66,  h: 252 },
        skill:   { top: 328, h: 54 },
        command: { top: 390, h: 54 },
        deliv:   { top: 454, h: 148 },
    };
    const VB_H = 454 + 148 + 6;               // 608
    const CARD_TOP = LANE.flow.top + 22;      // 88
    const CARD_BOT = LANE.flow.top + 150;     // 216
    const FLOW_CY  = (CARD_TOP + CARD_BOT) / 2; // 152
    const LOOP_Y   = CARD_BOT + 10;           // 226

    // Horizontal content range + left gutter
    const X_LEFT   = 84;
    const X_RIGHT  = 1252;
    const GUTTER   = 8;
    const GUTTER_W = 70;

    // --------------------------------------------------------------------------
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

    function evenCenters(n, xL = X_LEFT, xR = X_RIGHT) {
        const cw = (xR - xL) / n;
        return Array.from({ length: n }, (_, i) => xL + cw * (i + 0.5));
    }

    function card(x0, x1, y0, y1, opts = {}) {
        const rx = opts.rx ?? 18;
        const w = x1 - x0, h = y1 - y0;
        const fill = opts.fill ?? '#ffffff';
        const stroke = opts.stroke ?? '#cbd5e1';
        const sw = opts.sw ?? 1.8;
        const dash = opts.dash ? ` stroke-dasharray="${opts.dash}"` : '';
        const shadow = opts.shadow === false ? '' : ' filter="url(#shadow)"';
        return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${rx}" ry="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}${shadow}/>`;
    }

    function text(cx, cy, lines, opts = {}) {
        const size = opts.size ?? 13;
        const color = opts.color ?? '#0f172a';
        const weight = opts.weight ?? 700;
        const family = opts.family ?? 'system-ui';
        const lh = opts.lh ?? (size * 1.28);
        const totalH = lines.length * lh;
        let y = cy - totalH / 2 + lh * 0.82;
        let out = '';
        for (const ln of lines) {
            out += `<text x="${cx}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${color}" class="${family}">${esc(ln)}</text>`;
            y += lh;
        }
        return out;
    }

    function badge(x, y, label, tone = 'must', opts = {}) {
        const t = TONE[tone] ?? TONE.must;
        const size = opts.size ?? 7.5;
        const h = opts.h ?? (size + 5);
        const w = Math.max(18, label.length * size * 0.62 + 10);
        const align = opts.align ?? 'center';
        let bx = x - w / 2;
        if (align === 'left') bx = x;
        if (align === 'right') bx = x - w;
        const dash = t.dash ? ` stroke-dasharray="${t.dash}"` : '';
        return `<g><rect x="${bx}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${t.fill}" stroke="${t.stroke}" stroke-width="1"${dash}/><text x="${bx + w / 2}" y="${y + size * 0.36}" text-anchor="middle" font-size="${size}" font-weight="900" fill="${t.text}" class="mono" letter-spacing="0.4">${esc(label)}</text></g>`;
    }

    function hArrow(x1, x2, y, stroke, opts = {}) {
        const sw = opts.sw ?? 3.2;
        const dash = opts.dash ? ` stroke-dasharray="${opts.dash}"` : '';
        const head = 13;
        const dir = x2 > x1 ? 1 : -1;
        const hx = x2 - dir * head;
        let s = '';
        if (Math.abs(x2 - x1) > 6) {
            s += `<path d="M ${x1} ${y} L ${hx} ${y}" fill="none" stroke="${stroke}" stroke-width="${sw}"${dash} stroke-linecap="round"/>`;
        }
        s += `<path d="M ${x2} ${y} L ${x2 - dir * head} ${y - head * 0.55} L ${x2 - dir * head} ${y + head * 0.55} Z" fill="${stroke}"/>`;
        return s;
    }

    // Feedback loop (dashed) starting at source bottom, dipping down, back to target bottom.
    function loopArc(srcX, tgtX, stroke, labelStr, opts = {}) {
        const drop = opts.drop ?? 96;
        const sw = opts.sw ?? 2.4;
        const dash = opts.dash ?? '9 8';
        const y = opts.y ?? LOOP_Y;
        const d = `M ${srcX} ${y} C ${srcX} ${y + drop}, ${tgtX} ${y + drop}, ${tgtX} ${y}`;
        const head = 11;
        let s = `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}" stroke-linecap="round"/>`;
        s += `<path d="M ${tgtX} ${y} L ${tgtX - head * 0.42} ${y + head} L ${tgtX + head * 0.42} ${y + head} Z" fill="${stroke}"/>`;
        if (labelStr) {
            const size = opts.labelSize ?? 10;
            const lx = opts.labelX ?? (srcX + tgtX) / 2;
            const ly = y + drop * 0.5 + (opts.labelDy ?? 0);
            if (opts.labelBg) {
                const lw = labelStr.length * size * 0.62 + 10;
                s += `<rect x="${lx - lw / 2}" y="${ly - size - 1}" width="${lw}" height="${size + 5}" rx="4" fill="#fbfcfd" opacity="0.96"/>`;
            }
            s += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="${size}" font-weight="800" fill="${stroke}" class="mono" letter-spacing="1">${esc(labelStr)}</text>`;
        }
        return s;
    }

    function laneLabel(cy, str, x = GUTTER + 24) {
        return `<text x="${x}" y="${cy}" text-anchor="middle" transform="rotate(-90 ${x} ${cy})" font-size="11" font-weight="900" fill="#94a3b8" class="mono" letter-spacing="2">${esc(str)}</text>`;
    }

    function laneBg(y0, y1, gutterW = GUTTER_W, xRight = X_RIGHT) {
        return `<rect x="${gutterW}" y="${y0}" width="${xRight - gutterW}" height="${y1 - y0}" fill="#fbfcfd"/>`;
    }

    // Agent band across columns [i0..i1] — ranges must be disjoint
    function agentBand(cols, i0, i1, color, labelStr, opts = {}) {
        const x0 = cols[i0].x0, x1 = cols[i1].x1;
        const y0 = LANE.agent.top + 9, y1 = LANE.agent.top + LANE.agent.h - 5;
        const solid = opts.solid === true;
        const fill = solid ? color : (opts.fill ?? color + '1f');
        let s = card(x0, x1, y0, y1, { rx: 12, fill, stroke: color, sw: solid ? 0 : 1.8, shadow: false });
        const size = opts.size ?? 12;
        s += text((x0 + x1) / 2, (y0 + y1) / 2, [labelStr], { size, weight: 900, color: solid ? '#ffffff' : color, family: 'mono', lh: size * 1.25 });
        return s;
    }

    function normPill(p) {
        if (Array.isArray(p)) return { title: p[0] ?? '', sub: p[1] ?? '', tone: null };
        if (typeof p === 'string') return { title: p, sub: '', tone: null };
        return {
            title: p.label ?? '',
            sub: p.sub ?? '',
            tone: p.tone ?? null,
            badge: p.badge ?? null,
            badgeTone: p.badgeTone ?? p.tone ?? null,
            hitl: !!p.hitl,
            gateAfter: p.gateAfter ?? null,
            subSize: p.subSize ?? null,
            titleSize: p.titleSize ?? null,
        };
    }

    // Block card containing sub-pills (big rounded container)
    function blockCard(c, f) {
        const y0 = CARD_TOP - 10, y1 = CARD_BOT + 6;
        const xx0 = c.x0, xx1 = c.x1;
        let colStroke = '#cbd5e1', colColor = '#0f172a';
        if (f.kind === 'green') { colStroke = C.green; colColor = C.green; }
        if (f.kind === 'blue')  { colStroke = C.blue;  colColor = C.blue; }
        if (f.kind === 'teal')  { colStroke = C.teal;  colColor = C.teal; }
        if (f.kind === 'slate') { colStroke = C.slate; colColor = C.slate; }
        if (f.kind === 'dark')  { colStroke = C.slate; colColor = '#ffffff'; }

        let s = card(xx0, xx1, y0, y1, { rx: 20, fill: '#f8fafc', stroke: colStroke, sw: 2, dash: '5 5' });
        // stage label
        s += text((xx0 + xx1) / 2, y0 + 16, [f.stage], { size: 11, weight: 900, color: colColor, family: 'mono', lh: 13 });
        // pills
        const pillTop = y0 + 30, pillBot = y1 - 8;
        const n = f.subpills.length;
        const innerL = xx0 + 10, innerR = xx1 - 10;
        const gap = 8;
        const pw = (innerR - innerL - gap * (n - 1)) / n;
        const rendered = [];
        for (let i = 0; i < n; i++) {
            const p = normPill(f.subpills[i]);
            const px0 = innerL + i * (pw + gap), px1 = px0 + pw;
            const cxm = (px0 + px1) / 2;
            const pyl = (pillTop + pillBot) / 2;
            let stroke = colStroke, fill = '#ffffff';
            if (p.tone === 'opt')  { stroke = '#94a3b8'; fill = '#ffffff'; }
            if (p.tone === 'ifui') { stroke = C.blue; }
            if (p.tone === 'epic') { stroke = C.slate; }
            if (p.tone === 'teal') { stroke = C.teal; }
            const pillDash = p.tone === 'opt' ? '4 4' : null;
            s += card(px0, px1, pillTop, pillBot, { rx: 12, fill, stroke, sw: 1.6, dash: pillDash });
            const pillColor = p.tone === 'opt' ? '#64748b' : p.tone === 'teal' ? C.teal : colColor;
            if (p.sub) {
                s += `<text x="${cxm}" y="${pyl - 2}" text-anchor="middle" font-size="${p.titleSize ?? 12.5}" font-weight="800" fill="${pillColor}">${esc(p.title)}</text>`;
                s += `<text x="${cxm}" y="${pyl + 14}" text-anchor="middle" font-size="${p.subSize ?? 8.5}" font-weight="600" fill="${p.tone === 'opt' ? '#94a3b8' : pillColor + '99'}" class="mono">${esc(p.sub)}</text>`;
            } else {
                s += `<text x="${cxm}" y="${pyl + 4}" text-anchor="middle" font-size="13" font-weight="800" fill="${pillColor}">${esc(p.title)}</text>`;
            }
            if (p.badge) s += badge(cxm, pillTop + 9, p.badge, p.badgeTone ?? 'must', { size: 7 });
            if (p.hitl) s += badge(cxm, pillBot - 8, 'HITL', 'hitl', { size: 7 });
            rendered.push({ p, px0, px1 });
        }
        // HITL gate dividers between sub-pills
        for (let i = 0; i < rendered.length - 1; i++) {
            const cur = rendered[i], next = rendered[i + 1];
            if (cur.p.gateAfter !== 'hitl' && cur.p.gateAfter !== 'optional') continue;
            const gx = (cur.px1 + next.px0) / 2;
            const hitl = cur.p.gateAfter === 'hitl';
            s += `<line x1="${gx}" y1="${pillTop + 16}" x2="${gx}" y2="${pillBot - 16}" stroke="${hitl ? C.amber : C.gray}" stroke-width="2" stroke-dasharray="${hitl ? '4 4' : '2 4'}"/>`;
            s += `<circle cx="${gx}" cy="${pillTop + 9}" r="2.2" fill="${hitl ? C.amber : C.gray}"/>`;
        }
        return s;
    }

    function singleFlowCard(c, f) {
        const y0 = CARD_TOP, y1 = CARD_BOT;
        const xx0 = c.x0, xx1 = c.x1;
        let colStroke = '#cbd5e1', colFill = '#ffffff', colColor = '#0f172a', sw = 2, dash = null;
        if (f.kind === 'green') { colStroke = C.green; colColor = C.green; }
        if (f.kind === 'blue')  { colStroke = C.blue;  colColor = C.blue; }
        if (f.kind === 'teal')  { colStroke = C.teal;  colColor = C.teal; colFill = '#ffffff'; }
        if (f.kind === 'review'){ colStroke = C.red;  colColor = '#8a3b4a';  colFill = '#fbf1f3'; sw = 2.2; }
        if (f.kind === 'slate') { colStroke = '#94a3b8'; colFill = '#eef2f7'; colColor = '#334155'; sw = 1.8; }
        if (f.kind === 'dark')  { colStroke = '#94a3b8'; colFill = '#eef2f7'; colColor = '#334155'; sw = 1.8; }
        if (f.kind === 'opt')   { colStroke = '#94a3b8'; colColor = '#64748b'; dash = '5 4'; }
        if (f.dash) dash = f.dash;
        let s = card(xx0, xx1, y0, y1, { rx: 20, fill: colFill, stroke: colStroke, sw, dash });
        const cxm = (xx0 + xx1) / 2;
        s += `<text x="${cxm}" y="${FLOW_CY - 3}" text-anchor="middle" font-size="14.5" font-weight="900" fill="${colColor}">${esc(f.title)}</text>`;
        const subs = Array.isArray(f.sub) ? f.sub : (f.sub ? [f.sub] : []);
        const subColor = f.kind === 'dark' ? '#64748b' : (f.kind === 'review' ? '#9f5a68' : (f.kind === 'slate' ? '#64748b' : (f.kind === 'teal' ? '#0f766e' : (f.kind === 'opt' ? '#64748b' : '#94a3b8'))));
        const subSize = f.subSize ?? 10;
        if (subs.length === 1) {
            s += `<text x="${cxm}" y="${FLOW_CY + 16}" text-anchor="middle" font-size="${subSize}" font-weight="700" fill="${subColor}">${esc(subs[0])}</text>`;
        } else if (subs.length > 1) {
            s += text(cxm, FLOW_CY + (subs.length >= 3 ? 18 : 12), subs, { size: subSize, weight: 700, color: subColor, lh: subSize + 2.5 });
        }
        if (f.badge) s += badge(xx0 + 9, y0 + 12, f.badge, f.badgeTone ?? 'must', { align: 'left', size: 7 });
        if (f.badge2) s += badge(xx1 - 9, y0 + 12, f.badge2, f.badge2Tone ?? 'epic', { align: 'right', size: 7 });
        if (f.hitl) s += badge(xx1 - 9, y1 - 10, 'HITL', 'hitl', { align: 'right', size: 7 });
        if (f.gate) s += badge(xx1 - 9, y1 - 10, f.gate, f.gateTone ?? 'gate', { align: 'right', size: 7 });
        return s;
    }

    function gateRail(cols, gates) {
        let s = '';
        for (const g of gates) {
            const gx = (cols[g.left].x1 + cols[g.right].x0) / 2;
            s += badge(gx, LANE.flow.top + 6.5, g.label, g.tone, { size: 7.5, h: 11 });
        }
        return s;
    }

    // --------------------------------------------------------------------------
    function renderLayer(lay, cfg = {}) {
        const fit = lay.fitWidth === true;
        const oldL = 84, oldR = 1252;
        const newL = 56, newR = lay.xRight ?? 1392;
        const sx = fit ? (newR - newL) / (oldR - oldL) : 1;
        const mapX = v => fit ? newL + (v - oldL) * sx : v;
        const mapW = v => fit ? v * sx : v;
        const cx = lay.columns.map(c => {
            const ccx = mapX(c.cx), cw = mapW(c.w);
            return { cx: ccx, w: cw, x0: ccx - cw / 2, x1: ccx + cw / 2 };
        });
        const cols = lay.columns.map((c, i) => Object.assign({}, c, cx[i])); // each col carries x0/x1
        const vbW = lay.vbW ?? 1410;
        const gutterW = lay.gutterW ?? 48;
        const xRight = lay.xRight ?? 1392;
        const labelX = lay.labelX ?? 26;
        let s = `<svg class="bp-svg" viewBox="0 0 ${vbW} ${VB_H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;

        s += `<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
        </filter></defs>`;

        // lane backgrounds + labels
        s += laneBg(LANE.agent.top, LANE.agent.top + LANE.agent.h, gutterW, xRight);
        s += laneBg(LANE.flow.top, LANE.flow.top + LANE.flow.h, gutterW, xRight);
        s += laneBg(LANE.skill.top, LANE.skill.top + LANE.skill.h, gutterW, xRight);
        s += laneBg(LANE.command.top, LANE.command.top + LANE.command.h, gutterW, xRight);
        s += laneBg(LANE.deliv.top, LANE.deliv.top + LANE.deliv.h, gutterW, xRight);
        s += laneLabel(LANE.agent.top + LANE.agent.h / 2, 'AGENT', labelX);
        s += laneLabel(LANE.flow.top + LANE.flow.h / 2, 'FLOW', labelX);
        s += laneLabel(LANE.skill.top + LANE.skill.h / 2, 'SKILL', labelX);
        s += laneLabel(LANE.command.top + LANE.command.h / 2, 'COMMAND', labelX);
        s += laneLabel(LANE.deliv.top + LANE.deliv.h / 2, 'OUTPUT', labelX);

        // vertical dividers between lane rows
        s += `<line x1="${gutterW}" x2="${xRight}" y1="${LANE.agent.top + LANE.agent.h}" y2="${LANE.agent.top + LANE.agent.h}" stroke="#eef2f7" stroke-width="2"/>`;
        s += `<line x1="${gutterW}" x2="${xRight}" y1="${LANE.skill.top}" y2="${LANE.skill.top}" stroke="#eef2f7" stroke-width="2"/>`;

        loops: [
            { fromCol: 6, toCol: 5, label: 'FIX LOOP', color: C.red, drop: 44, fromEdge: 'center', toEdge: 'center', dash: '6 4', labelSize: 9, labelBg: true, labelX: 1061 },
            { fromCol: 8, toCol: 3, label: 'NEXT STORY', color: C.blue, drop: 64, fromEdge: 'left', toEdge: 'right', dash: '8 6', labelBg: true, labelX: 860 },
            { fromCol: 8, toCol: 0, label: 'EPIC DONE · BASELINE SYNC + HITL', color: C.green, drop: 88, fromEdge: 'left', toEdge: 'left', dash: '8 6', labelSize: 8.5, labelBg: true },
        ],
    };

    const LEGEND_04 = `
        <div class="grid grid-cols-2 gap-x-8 gap-y-1">
            <div class="space-y-1">
                <div class="flex items-start gap-2">
                    <span class="legend-group">流转</span>
                    <div class="flex flex-1 flex-wrap items-center gap-x-4 gap-y-1">
                        <span class="legend-item"><span class="legend-solid"></span>AUTO</span>
                        <span class="legend-item"><span class="legend-line" style="border-style:dashed;border-color:#d97706"></span>HITL</span>
                        <span class="legend-item"><span class="legend-line" style="border-style:dashed;border-color:#94a3b8"></span>OPT</span>
                        <span class="legend-item"><span class="legend-line" style="border-style:dashed;border-color:#9f4a5a"></span>FIX</span>
                        <span class="legend-item"><span class="legend-line" style="border-style:dashed;border-color:#1677ff"></span>NEXT STORY</span>
                        <span class="legend-item"><span class="legend-line" style="border-style:dashed;border-color:#00b96b"></span>EPIC BASE</span>
                    </div>
                </div>
                <div class="flex items-start gap-2">
                    <span class="legend-group">步骤</span>
                    <div class="flex flex-1 flex-wrap items-center gap-x-3 gap-y-1">
                        <span class="legend-badge must">MUST</span><span class="legend-desc">必做</span>
                        <span class="legend-badge opt">OPT</span><span class="legend-desc">可选</span>
                        <span class="legend-badge ifui">IF UI</span><span class="legend-desc">仅UI</span>
                        <span class="legend-badge epic">EPIC</span><span class="legend-desc">收尾</span>
                        <span class="legend-badge hitl">HITL</span><span class="legend-desc">必停</span>
                        <span class="legend-badge gate">GATE</span><span class="legend-desc">门禁</span>
                    </div>
                </div>
            </div>
            <div class="space-y-1">
                <div class="flex items-start gap-2">
                    <span class="legend-group">口径</span>
                    <div class="flex-1 font-mono font-bold text-slate-700 leading-tight">
                        <div>12 MUST · 1 IF UI · 1 OPT · 1 EPIC</div>
                        <div>8 HITL · 5 AUTO · 1 Review Gate</div>
                    </div>
                </div>
                <div class="flex items-start gap-2">
                    <span class="legend-group">HITL</span>
                    <div class="flex-1 text-amber-700 leading-tight">调研 → 探索 → 原型(IF UI) → 架构(OPT) → 故事 → 测试设计 → 设计冻结 → Baseline(Epic)</div>
                </div>
                <div class="text-[7.5px] text-slate-400 leading-tight">* /req:arch · /req:test-design · /opsx:review = Layer 04 建议新增</div>
            </div>
        </div>`;

    // ==========================================================================
    function slideHTML(num, theme, title, subtitle, tag, tagClass, svg, opts = {}) {
        const numBg = theme === 'green' ? 'bg-aidd-green' : theme === 'blue' ? 'bg-aidd-blue' : theme === 'red' ? 'bg-rose-50 border border-rose-200' : 'bg-slate-900';
        const numText = theme === 'red' ? 'text-rose-800' : 'text-white';
        const numShadow = theme === 'green' ? 'shadow-green-200' : theme === 'blue' ? 'shadow-blue-200' : theme === 'red' ? 'shadow-rose-100' : 'shadow-slate-400';
        const bodyClass = opts.legend ? 'bp-body with-legend' : 'bp-body';
        return `<section class="slide">
            <div class="slide-header">
                <div class="flex items-center gap-6">
                    <div class="${numBg} ${numText} flex items-center justify-center text-3xl font-black rounded-2xl shadow-lg ${numShadow} w-16 h-16">${num}</div>
                    <div>
                        <h2 class="text-3xl font-serif font-black text-slate-900">${title}</h2>
                        <p class="text-slate-400 font-medium uppercase tracking-widest text-sm mt-1">${subtitle}</p>
                    </div>
                </div>
                <span class="px-4 py-1 rounded-full text-xs font-bold tracking-tighter ${tagClass}">${tag}</span>
            </div>
            <div class="${bodyClass}">${svg}${opts.legend ? `<div class="bp-legend">${opts.legend}</div>` : ''}</div>
        </section>`;
    }

    const slidesHtml = [
        slideHTML('01', 'green', '极简交付 · Layer 01', 'Minimalist Delivery / Single Change Pipeline',
            'SPEC-DRIVEN DEVELOPMENT', 'bg-slate-100 text-slate-500', renderLayer(layer1)),
        slideHTML('02', 'blue', '轻量产品 · Layer 02', 'Lightweight Product / Baseline Guardrail / Multi-Story Loop',
            'COLLABORATIVE SDD', 'bg-slate-100 text-slate-500', renderLayer(layer2)),
        slideHTML('03', 'dark', '业务产品 · Layer 03', 'Business Product / Requirement Funnel / Double-Loop Governance',
            'ENTERPRISE SDD FRAMEWORK', 'bg-aidd-green text-white', renderLayer(layer3)),
        slideHTML('04', 'red', '生产级交付 · Layer 04', 'Production-Grade SDD / Test Left-Shift · Arch Gate (OPT) · Adversarial Review (MUST)',
            'HARNESS · 12 MUST · 8 HITL · 5 AUTO', 'bg-rose-50 text-rose-800 border border-rose-200', renderLayer(layer4), { legend: LEGEND_04 }),
    ];

    document.getElementById('slides').innerHTML = slidesHtml.join('');
    </script>
</body>
</html>
