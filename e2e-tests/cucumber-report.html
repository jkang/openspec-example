window.CUCUMBER_MESSAGES = [{"meta":{"protocolVersion":"24.1.0","implementation":{"version":"10.9.0","name":"cucumber-js"},"cpu":{"name":"arm64"},"os":{"name":"darwin","version":"25.5.0"},"runtime":{"name":"node.js","version":"24.13.0"}}},{"source":{"data":"Feature: B 端用户管理（用户账户体系 - story-account-system-admin-users）\n  提取自 specs\/user-admin\/spec.md 中标记 @e2e 的场景与 story.md E2E 验收旅程（旅程 1\/2\/3），\n  通过 Vue 前端 (5173) + Node 后端 (3000) 全链路验证：运营检索下钻用户订单 → 禁用用户联动会话失效 → 客服权限拦截（敏感信息保护）。\n\n  @e2e\n  Scenario: 正常主流程——按手机号检索并下钻用户订单\n    Given 运营陈晓芸已登录 B 端后台（运营角色）\n    And 系统存在买家林晓明（手机号 13888217536）且有订单\n    When 运营进入「用户管理」并输入手机号 13888217536 搜索\n    Then 用户列表返回 林晓明（状态正常，展示手机号 13888217536）\n    And 点击用户详情展示林晓明的订单\n\n  @e2e\n  Scenario: 禁用用户导致会话失效（跨 Story 联动）\n    Given 用户王强（手机号 15876543210）已登录且会话有效\n    And 运营陈晓芸已登录 B 端后台（运营角色）\n    When 运营在用户管理界面中将王强禁用\n    Then 王强状态变为\"已禁用\"\n    And 王强恢复其会话并再次访问\"我的订单\"\n    Then 会话校验失败并被引导重新登录\n    And 登录页提示\"该账户已被禁用，如有疑问请联系平台客服\"\n\n  @e2e\n  Scenario: 权限拦截——客服账号访问用户管理\n    Given 客服小赵已登录 B 端后台（客服角色）\n    When 客服查看后台侧边栏\n    Then 侧边栏不显示「用户管理」入口\n    And 调用用户列表接口被拒绝且不返回任何手机号\n","uri":"features\/account_admin_users.feature","mediaType":"text\/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"B 端用户管理（用户账户体系 - story-account-system-admin-users）","description":"  提取自 specs\/user-admin\/spec.md 中标记 @e2e 的场景与 story.md E2E 验收旅程（旅程 1\/2\/3），\n  通过 Vue 前端 (5173) + Node 后端 (3000) 全链路验证：运营检索下钻用户订单 → 禁用用户联动会话失效 → 客服权限拦截（敏感信息保护）。","children":[{"scenario":{"id":"a9518acf-1acf-4555-b51a-52e0bc6e0448","tags":[{"location":{"line":5,"column":3},"name":"@e2e","id":"112a3dbb-d705-45bb-9a57-50c6e9223b71"}],"location":{"line":6,"column":3},"keyword":"Scenario","name":"正常主流程——按手机号检索并下钻用户订单","description":"","steps":[{"id":"11008523-031d-479a-89f9-2d7a5ad0e526","location":{"line":7,"column":5},"keyword":"Given ","keywordType":"Context","text":"运营陈晓芸已登录 B 端后台（运营角色）"},{"id":"
