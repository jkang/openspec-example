<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Narrative - {{ story_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; color: #1e293b; }
        .prose h1 { color: #0f172a; font-weight: 800; font-size: 2.25rem; margin-bottom: 1.5rem; border-bottom: 4px solid #3b82f6; display: inline-block; padding-bottom: 4px; }
        .prose h2 { color: #1e40af; font-weight: 700; font-size: 1.5rem; margin-top: 2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .prose h2::before { content: ''; width: 4px; height: 24px; background: #3b82f6; border-radius: 2px; }
        .prose h3 { color: #334155; font-weight: 600; font-size: 1.1rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .prose p { line-height: 1.75; margin-bottom: 1rem; color: #475569; }
        
        /* Scope Specific Styling */
        .prose h3:contains("Scope IN") { color: #059669; }
        .prose h3:contains("Scope OUT") { color: #dc2626; }
        
        .prose ul { list-style: none; padding-left: 0; }
        .prose li { position: relative; padding-left: 1.5rem; margin-bottom: 0.5rem; line-height: 1.6; }
        .prose li::before { content: '→'; position: absolute; left: 0; color: #3b82f6; font-weight: bold; }
        
        /* Custom list style for IN/OUT */
        .scope-in li::before { content: '✓'; color: #059669; }
        .scope-out li::before { content: '✕'; color: #dc2626; }
        .prose blockquote { border-left: 4px solid #e2e8f0; padding-left: 1rem; font-style: italic; color: #64748b; margin: 1.5rem 0; }
        
        /* Professional Table Styling */
        .prose table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 2rem 0; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; font-size: 0.85rem; }
        .prose th { background: #f8fafc; color: #475569; font-weight: 700; text-align: left; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; }
        .prose td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: top; }
        .prose tr:last-child td { border-bottom: none; }
        .prose tr:nth-child(even) { background: #fafbfc; }
        
        .card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-8 md:p-16">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12">
            <div class="flex items-center gap-3 text-blue-600 font-bold text-sm uppercase tracking-widest mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Story Narrative Report
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">故事详述：{{ story_title }}</h1>
            <div class="mt-6 flex flex-wrap gap-4 text-sm text-slate-500">
                <div class="bg-slate-100 px-3 py-1.5 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span> 状态: 已就绪
                </div>
                <div class="bg-slate-100 px-3 py-1.5 rounded-full flex items-center gap-2">
                    📅 生成日期: 2026-04-26
                </div>
            </div>
        </header>

        <main class="card p-8 md:p-12 prose max-w-none" id="narrative-content">
            <!-- Content will be injected here -->
        </main>

        <footer class="mt-12 text-center text-slate-400 text-sm">
            &copy; 2026 AI Product Manager Suite. Generated based on AIStorymap logic.
        </footer>
    </div>

    <script type="application/json" id="narrative-markdown">{{ narrative_markdown_json }}</script>
    <script>
        const markdown = JSON.parse(document.getElementById('narrative-markdown').textContent);
        document.getElementById('narrative-content').innerHTML = marked.parse(markdown);
    </script>
</body>
</html>
