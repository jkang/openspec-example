<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 极简电商</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * { border-radius: 0 !important; box-shadow: none !important; }
        body { background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .border-slate-200 { border-color: #e2e8f0; }
        input:focus, select:focus { outline: none; border-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app">
        <!-- 顶部导航 -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-slate-900 flex items-center justify-center text-white text-xs font-bold">M</div>
                <h1 class="text-lg font-semibold tracking-tight uppercase">Minimal Store</h1>
            </div>
            <div class="flex items-center gap-6 text-sm font-medium">
                <template v-if="!currentUser">
                    <a class="py-1 px-2 border border-slate-200 hover:bg-slate-50 cursor-pointer" @click="gotoRegister">还没有账户？去注册</a>
                </template>
                <template v-else>
                    <span class="py-1 px-2 border border-slate-900 bg-slate-50">{{ currentUser.nickname }}</span>
                    <button class="py-1 px-2 border border-slate-200 hover:bg-slate-50" @click="logout">退出登录</button>
                </template>
            </div>
        </header>

        <main class="max-w-3xl mx-auto p-8 space-y-6">
            <!-- 登录表单视图 -->
            <section v-if="!currentUser" class="bg-white border border-slate-200 max-w-md mx-auto">
                <div class="px-8 py-6 border-b border-slate-200">
                    <h2 class="text-xl font-bold tracking-tight">登录</h2>
                    <p class="text-sm text-slate-500 mt-1">使用邮箱 + 密码登录，登录后新下的订单归属本人。</p>
                </div>
                <div class="px-8 py-6 space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-1">邮箱</label>
                        <input v-model.trim="form.email" type="email" placeholder="buyer@trade-demo.com"
                               class="w-full border border-slate-200 px-3 py-2 text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">密码</label>
                        <input v-model="form.password" @keyup.enter="login" type="password" placeholder="trade1234"
                               class="w-full border border-slate-200 px-3 py-2 text-sm bg-white">
                    </div>

                    <div v-if="loginError" class="border border-slate-900 bg-slate-50 px-4 py-3 text-sm">
                        <span class="font-bold">{{ loginError }}</span>
                    </div>

                    <button @click="login" :disabled="loggingIn"
                            class="w-full bg-slate-900 text-white py-2.5 text-sm font-medium hover:bg-slate-700 disabled:opacity-60">
                        {{ loggingIn ? '登录中...' : '登录' }}
                    </button>
                    <p class="text-xs text-slate-400">演示账号：张采购（buyer@trade-demo.com / trade1234）· 禁用账号：陈采购（chen@trade-demo.com）</p>
                </div>
            </section>

            <!-- 登录成功视图（个人区 + 我的订单归属隔离） -->
            <template v-else>
                <section class="bg-white border border-slate-200">
                    <div class="px-8 py-6 border-b border-slate-200 flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold tracking-tight">个人区</h2>
                            <p class="text-sm text-slate-500 mt-1">会话令牌已下发（有效期 30 天），刷新不掉登录态。</p>
                        </div>
                        <button class="border border-slate-200 px-3 py-1.5 text-xs font-medium hover:bg-slate-50" @click="gotoPlaceOrder">继续下单</button>
                    </div>
                    <div class="px-8 py-5 grid grid-cols-2 gap-3 text-sm">
                        <div><span class="text-slate-500">邮箱:</span> <span class="font-mono">{{ currentUser.email }}</span></div>
                        <div><span class="text-slate-500">昵称:</span> <span class="font-bold">{{ currentUser.nickname }}</span></div>
                        <div><span class="text-slate-500">手机号:</span> <span class="font-mono">{{ currentUser.phone }}</span></div>
                        <div><span class="text-slate-500">账户状态:</span> <span class="font-bold">{{ currentUser.status }}</span></div>
                    </div>
                </section>

                <section class="bg-white border border-slate-200">
                    <div class="px-8 py-4 border-b border-slate-200">
                        <h3 class="font-bold">我的订单</h3>
                        <p class="text-xs text-slate-400 mt-0.5">仅返回归属本人（Order.userId = {{ currentUser.id }}）的订单，倒序展示</p>
                    </div>
                    <div v-for="o in myOrders" :key="o.id" class="px-8 py-4 border-b border-slate-200 last:border-b-0">
                        <div class="flex items-center justify-between text-sm">
                            <div>
                                <div class="font-mono text-xs text-slate-500">#{{ o.id }}</div>
                                <div class="text-slate-700 mt-0.5">{{ o.items[0].name }}<template v-if="o.items.length > 1"> 等 {{ o.items.length }} 件</template></div>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-mono font-bold">¥{{ (o.actualPaidCents / 100).toFixed(2) }}</span>
                                <span class="text-xs font-bold border border-slate-200 px-2 py-1">{{ statusLabel(o.status) }}</span>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 mt-1">{{ o.createdAt }}</div>
                    </div>
                </section>
            </template>
        </main>
    </div>

    <script>
        const { createApp, ref, reactive, computed } = Vue;

        // 模拟用户池（含状态）
        const USERS = {
            'buyer@trade-demo.com': { id: 'user_zhang', email: 'buyer@trade-demo.com', nickname: '张采购', phone: '13800001234', password: 'trade1234', status: 'ACTIVE' },
            'chen@trade-demo.com':  { id: 'user_chen', email: 'chen@trade-demo.com',  nickname: '陈采购', phone: '13700009988', password: 'trade1234', status: 'DISABLED' }
        };

        // 模拟订单池：张采购 3 笔本人订单 + 1 笔 user_dev 存量订单（不显示）
        const ALL_ORDERS = [
            { id: 'order_kx9f2m7q', userId: 'user_zhang', status: 'PAID', actualPaidCents: 1299900, createdAt: '2026-08-27 10:24', items: [{ name: 'MacBook Pro 14英寸' }] },
            { id: 'order_ab2c8d3e', userId: 'user_zhang', status: 'SHIPPED', actualPaidCents: 29900, createdAt: '2026-08-26 15:07', items: [{ name: '极简机械键盘' }] },
            { id: 'order_mn5x7y9z', userId: 'user_zhang', status: 'COMPLETED', actualPaidCents: 6800, createdAt: '2026-08-25 09:41', items: [{ name: '铝合金笔记本支架' }] },
            { id: 'order_legacy_1', userId: 'user_dev', status: 'PAID', actualPaidCents: 45900, createdAt: '2026-08-20 11:02', items: [{ name: '存量无归属订单（user_dev，不显示）' }] }
        ];

        createApp({
            setup() {
                const form = reactive({ email: '', password: '' });
                const loginError = ref('');
                const loggingIn = ref(false);
                const currentUser = ref(null);

                const myOrders = computed(() =>
                    ALL_ORDERS.filter(o => o.userId === currentUser.value.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt))
                );
                const statusLabel = (s) => ({ PENDING_PAYMENT: '待支付', PAID: '已支付', SHIPPED: '已发货', COMPLETED: '已完成', CANCELLED: '已取消' }[s] || s);

                const login = () => {
                    loginError.value = '';
                    const user = USERS[form.email.trim().toLowerCase()];
                    if (!user || user.password !== form.password) {
                        loginError.value = '邮箱或密码错误，请重试';
                        return;
                    }
                    if (user.status === 'DISABLED') {
                        loginError.value = '账户已被禁用，请联系管理员';
                        return;
                    }
                    loggingIn.value = true;
                    setTimeout(() => {
                        loggingIn.value = false;
                        currentUser.value = user;
                    }, 300);
                };

                const logout = () => { currentUser.value = null; form.email = ''; form.password = ''; };
                const gotoRegister = () => alert('原型演示：跳转「用户注册」页（prototypes/account-system/account-register.html）');
                const gotoPlaceOrder = () => alert('原型演示：继续下单（未登录拦截与会话保持见 account-session.html）');

                return { form, loginError, loggingIn, currentUser, myOrders, statusLabel, login, logout, gotoRegister, gotoPlaceOrder };
            }
        }).mount('#app');
    </script>
</body>
</html>
