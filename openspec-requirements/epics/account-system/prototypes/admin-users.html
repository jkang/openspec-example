<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理（B 端） - 极简电商</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * { border-radius: 0 !important; box-shadow: none !important; }
        body { background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .border-slate-200 { border-color: #e2e8f0; }
        input:focus { outline: none; border-color: #0f172a; }
        table th, table td { text-align: left; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app">
        <!-- 顶部导航（B 端运营后台） -->
        <header class="h-16 bg-slate-900 text-white flex items-center justify-between px-8">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-white text-slate-900 flex items-center justify-center text-xs font-bold">M</div>
                <h1 class="text-lg font-semibold">Minimal Store · 运营后台</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span class="py-1 px-2 border border-slate-700 bg-slate-800">王运营</span>
                <button class="py-1 px-2 border border-slate-700 hover:bg-slate-800">退出</button>
            </div>
        </header>

        <div class="flex">
            <!-- 左侧导航 -->
            <nav class="w-48 bg-white border-r border-slate-200 min-h-screen">
                <a class="block py-3 px-4 text-sm border-b border-slate-200 bg-slate-50 border-l-2 border-slate-900 font-medium">用户管理</a>
                <a class="block py-3 px-4 text-sm border-b border-slate-200 text-slate-600">订单管理</a>
                <a class="block py-3 px-4 text-sm border-b border-slate-200 text-slate-600">商品管理</a>
                <a class="block py-3 px-4 text-sm border-b border-slate-200 text-slate-600">优惠券管理</a>
            </nav>

            <!-- 主内容：用户列表 -->
            <main class="flex-1 p-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-semibold">用户列表</h2>
                    <div class="text-sm text-slate-600">共 {{ users.length }} 位用户</div>
                </div>

                <!-- 搜索栏 -->
                <div class="flex items-center gap-4 mb-6">
                    <input v-model="keyword" type="text" placeholder="按邮箱 / 昵称搜索"
                           class="w-72 px-3 py-2 border border-slate-200 bg-white text-sm">
                    <button @click="applySearch" class="px-4 py-2 border border-slate-900 bg-slate-900 text-white text-sm hover:bg-slate-800">搜索</button>
                    <button @click="resetSearch" class="px-4 py-2 border border-slate-200 text-sm hover:bg-slate-50">重置</button>
                </div>

                <!-- 用户表格 -->
                <table class="w-full border border-slate-200 bg-white text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-4 py-3 font-medium">用户 ID</th>
                            <th class="px-4 py-3 font-medium">昵称</th>
                            <th class="px-4 py-3 font-medium">邮箱</th>
                            <th class="px-4 py-3 font-medium">注册时间</th>
                            <th class="px-4 py-3 font-medium">状态</th>
                            <th class="px-4 py-3 font-medium">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="u in filteredUsers" :key="u.id" class="border-b border-slate-200">
                            <td class="px-4 py-3">{{ u.id }}</td>
                            <td class="px-4 py-3">{{ u.nickname }}</td>
                            <td class="px-4 py-3">{{ u.email }}</td>
                            <td class="px-4 py-3">{{ u.createdAt }}</td>
                            <td class="px-4 py-3">
                                <span :class="u.status === 'ACTIVE' ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-600'"
                                      class="px-2 py-0.5 text-xs">{{ u.status === 'ACTIVE' ? '正常' : '已停用' }}</span>
                            </td>
                            <td class="px-4 py-3">
                                <button v-if="u.status === 'ACTIVE'"
                                        @click="toggleStatus(u)" class="px-2 py-1 border border-slate-200 text-xs hover:bg-slate-50">停用</button>
                                <button v-else
                                        @click="toggleStatus(u)" class="px-2 py-1 border border-slate-200 text-xs hover:bg-slate-50">启用</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- 空态 -->
                <div v-if="filteredUsers.length === 0" class="border border-slate-200 bg-white p-10 text-center text-sm text-slate-600">
                    未找到匹配的用户，请调整搜索条件。
                </div>

                <!-- 状态提示 -->
                <div v-if="notice" class="mt-4 px-4 py-2 border border-slate-900 bg-slate-50 text-sm">
                    {{ notice }}
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    keyword: '',
                    notice: '',
                    users: [
                        { id: 'U1001', nickname: '张采购', email: 'zhang@trade.com', createdAt: '2026-08-15', status: 'ACTIVE' },
                        { id: 'U1002', nickname: '李运营', email: 'li@trade.com', createdAt: '2026-08-15', status: 'ACTIVE' },
                        { id: 'U1003', nickname: '王会计', email: 'wang@trade.com', createdAt: '2026-08-16', status: 'DISABLED' },
                        { id: 'U1004', nickname: '赵店长', email: 'zhao@store.com', createdAt: '2026-08-18', status: 'ACTIVE' },
                        { id: 'U1005', nickname: '孙客服', email: 'sun@store.com', createdAt: '2026-08-20', status: 'ACTIVE' }
                    ]
                };
            },
            computed: {
                filteredUsers() {
                    if (!this.keyword.trim()) return this.users;
                    const k = this.keyword.trim().toLowerCase();
                    return this.users.filter(u =>
                        u.email.toLowerCase().includes(k) || u.nickname.includes(k)
                    );
                }
            },
            methods: {
                applySearch() { /* computed 已过滤，无需额外逻辑 */ },
                resetSearch() { this.keyword = ''; this.notice = ''; },
                toggleStatus(u) {
                    u.status = u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE';
                    this.notice = `已${u.status === 'ACTIVE' ? '启用' : '停用'}用户「${u.nickname}」`;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
