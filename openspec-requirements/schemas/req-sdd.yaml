name: req-sdd
version: 7
description: 需求侧工作流（仅用于大块 Epic 需求） - 需求调研 (research) → 探索 (explore) → 原型 (prototype，Epic 整体) → 架构影响 (arch-impact，OPT) → 需求拆分 (storymap) → 需求单元交付物 (story) → 测试设计 (test-design，MUST) → handoff。规划（roadmap·每阶段多 Epic）在起点 docs/ROADMAP.md 已有，需求侧直接消费。需求侧只产出业务面 story.md 与测试设计 test-design.md；行为规格（Story-specs，按 capability 拆分的 specs）由开发侧在 handoff 合成 proposal 之后生成。Bug Fix / Tech Debt / 简单功能修改不走本流程，直接进入交付侧。
analysis:
  description: 需求分析工具箱（可选增强） - openspec-requirements/tools/ 与各 skill references/ 提供的需求工程方法与可视化产物。所有分析制品均为 optional，缺省不影响原漏斗 HITL 门禁。
  tools_path: openspec-requirements/tools/
  tool_map:
    osm: osm-map-generator
    process: business-process-deep-analyzer
    journey: journey-map-generator
    blueprint: blueprint-map-generator
    design-system: brand-design-system
    working-prototype: prototype-generator
    storymap-visual: story-map-generator
    narrative: story-narrative-generator
  method_map:
    interview-outline: .agents/skills/prod/research/references/interview-outline.md
    interview-record: .agents/skills/prod/research/references/record-integration.md
    problem: .agents/skills/prod/explore/references/problem-definition.md
    value-stream: .agents/skills/prod/explore/references/value-stream.md
    to-be: .agents/skills/prod/explore/references/to-be-process.md
    competitor: .agents/skills/prod/explore/references/competitor-benchmark.md
    storymap-method: .agents/skills/prod/storymap/references/story-map-method.md
    story-narrative: .agents/skills/prod/story/references/story-narrative.md
artifacts:
  - id: research
    generates: epics/<epic-key>/research.md
    description: 需求调研（针对单个 Epic），收集需求信息（业务沟通/用户调研），含访谈原始记录
    template: research.md
    instruction: |
      调用 `research` skill 生成需求调研纪要。

      必须：
      1. **针对单个 Epic**：Epic 来自 `docs/ROADMAP.md` 的阶段条目（一句话描述）。
      2. **只负责收集**：记录 Epic 背景、调研对象、**访谈原始记录（内嵌，每条含 对象/时间方式/原始摘录/关键信号）**、原始需求信息、业务约束与规则线索、疑问待澄清项、调研结论。
      3. **访谈原始记录是内嵌组成部分**：保留一手证据（原始对话摘录），不建独立文件。
      4. **可选访谈提纲**：按 `research/references/interview-outline.md` 三段骨架生成提纲，模板 `interview-outline.md`，产物 `analysis/interview/outline.md`。
      5. **记录归位**：有多源材料时按 `research/references/record-integration.md` 做事实归位——只记录事实、未提及显式标注、专有名词入待澄清，结果内嵌 research.md。
      6. **不做转化**：不转化为产品设计思路（那是 explore/idea 的职责）。
      7. **治理提示**：可初步留意候选 Bounded Contexts（不强制，explore 阶段深化）。

      该文档是 explore 的输入源。**HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（explore）。
    requires: []

  - id: analysis-interview-outline
    optional: true
    generates: epics/<epic-key>/analysis/interview/outline.md
    description: （可选）现状访谈提纲，三段骨架（角色背景 / 信息流现状 / 理想态）
    template: interview-outline.md
    instruction: |
      按 `research/references/interview-outline.md` 生成访谈提纲。

      时机：research 阶段前置（可选）；简单/单点调研可跳过。

      必须：
      1. **三段骨架**：角色与业务背景 / 信息流现状（捕捉→处理→决策→复用）/ 理想态与资源重排。
      2. **简洁**：每小节 ≤4 题、★必问 ≤40%、单册 ≤45 题。
      3. **只还原现状**：不评价、不引导方案。
      4. **提纲即记录纸**：不另出填写模板。
      5. 产物：`epics/<key>/analysis/interview/outline.md`。

      **HITL**：纳入 research 的 HITL 确认范围。
    requires: []

  - id: explore
    generates: epics/<epic-key>/idea.md
    description: 探索（转化），把调研信息转化为产品设计思路（含 To-Be 业务设计与候选 Capabilities）
    template: idea.md
    instruction: |
      调用 `explore` skill 执行探索，产出 idea.md。

      **强制要求**：必须基于已确认的 `epics/<epic-key>/research.md`。若缺失，停止并回退。

      必须：
      1. **澄清业务意图**：目的、范围、业务规则；B 端视角（后台配置/生命周期/权限）与 C 端视角。
      2. **可选：问题定义（8 要素）**：按 `explore/references/problem-definition.md` 输出，为 Exit Criteria 提供可量化依据；产物 `analysis/problem/problem-definition.md`。
      3. **可选：As-Is 价值流**：按 `explore/references/value-stream.md` 梳理 L1 价值流与聚焦范围；产物 `analysis/value-stream/value-stream.md`。
      4. **To-Be Process**：按 `explore/references/to-be-process.md` 设计目标流程（L3→L5、人机分工、HITL 焦点、异常链路），与现状差异点。
      5. **To-Be Journey**：目标用户体验旅程（用户动作/系统反应/情绪/触点）。
      6. **可选：竞品与参考案例**：按 `explore/references/competitor-benchmark.md` 在原型前做外部对标与设计取舍；产物 `analysis/competitor/competitor.md`。
      7. **产品设计思路**：业务逻辑流转与用户价值。
      8. **任务类型确认与路由**：Epic / Feature / Bug Fix / Tech Debt。
         - Bug Fix / Tech Debt / 简单功能修改 → 直走交付侧，不继续需求漏斗。
      9. **候选 Capabilities（关键）**：参考 `docs/baseline/domain_model.html` 的 BC→Capability 映射，识别新增/修改 Capability（新增标"新增 taxonomy"及理由）。这是 handoff 合成 proposal 与开发侧 specs/<capability>/ 落位的依据。
      10. **治理映射对齐**：参考 `business_process.html`（L1/L2/L3）、`service_blueprint.html`（SB-STAGE-*/SB-<LANE>-*）。
      11. **需求拆分建议 + 架构影响分析**。

      **可选制品**：问题定义 / 价值流 / To-Be 泳道 / 竞品对标均为 optional，不得因未做而阻塞漏斗。As-Is 与 To-Be 必须分清。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（prototype/storymap）。
    requires:
      - research

  - id: analysis-osm
    optional: true
    generates: epics/<epic-key>/analysis/osm/{osm.yaml,osm.html}
    description: （可选）Epic 目标-策略-度量（OSM），为 Exit Criteria 提供可度量指标锚点
    template: null
    tool: openspec-requirements/tools/osm-map-generator/SKILL.md
    instruction: |
      调用分析工具 `osm-map-generator`（openspec-requirements/tools/）生成 Epic 的 OSM 地图（Objective → Strategy → Metric）。

      时机：explore 阶段（可选增强），在产出 idea.md 后对 Epic 整体目标做度量分解。

      必须：
      1. **Objective**：对齐 ROADMAP 阶段条目与 idea 的业务意图，定义 1 个主目标。
      2. **Strategy**：拆出 2-4 条达成策略。
      3. **Metric**：每个策略给出可量化指标（含当前值/目标值），作为 storymap 覆盖对账与开发侧 Exit Criteria 的度量锚点。
      4. **真实数据**：拒绝空洞占位符，指标须为真实业务量级。
      5. 产物：`epics/<key>/analysis/osm/osm.yaml` + `osm.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-process
    optional: true
    generates: epics/<epic-key>/analysis/process/{process.yaml,process.html}
    description: （可选）As-Is 业务流程深度分析（L1/L2 + 痛点热力），作为 To-Be 的现状基线
    template: null
    tool: openspec-requirements/tools/business-process-deep-analyzer/SKILL.md
    instruction: |
      调用分析工具 `business-process-deep-analyzer`（openspec-requirements/tools/）生成 **As-Is** 业务流程分析。

      时机：explore 阶段（可选增强），在 To-Be Process 之前产出，作为现状基线。

      必须：
      1. **业务类型分型**：业务模式/产品类型/市场类型。
      2. **L1 价值流**：端到端价值流阶段（与 business_process.html 的 L1 口径对齐）。
      3. **L2 流程**：每阶段展开活动/角色/系统/输入输出/业务规则。
      4. **痛点**：标注 critical/high/medium/low，含根因分析。
      5. **真实数据**：拒绝空洞占位符。
      6. 产物：`epics/<key>/analysis/process/process.yaml` + `process.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-journey
    optional: true
    generates: epics/<epic-key>/analysis/journey/{journey.yaml,journey.html}
    description: （可选）To-Be Journey 可视化（阶段/行为/触点/情绪/痛点），升级 idea 的纯文本旅程
    template: null
    tool: openspec-requirements/tools/journey-map-generator/SKILL.md
    instruction: |
      调用分析工具 `journey-map-generator`（openspec-requirements/tools/）生成 To-Be Journey 可视化。

      时机：explore 阶段（可选增强），与 idea.md 的 To-Be Journey 章节并行产出。

      必须：
      1. **mode: to-be**：目标旅程设计（非现状诊断）。
      2. **阶段**：≥3 个旅程阶段；每阶段 1-3 个核心用户动作。
      3. **维度**：每个动作含 触点 / 情绪体验分(1-10) / 想法 / 痛点或期望改善。
      4. **真实数据**：拒绝空洞占位符，使用真实业务场景。
      5. 产物：`epics/<key>/analysis/journey/journey.yaml` + `journey.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-problem
    optional: true
    generates: epics/<epic-key>/analysis/problem/problem-definition.md
    description: （可选）业务问题定义（8 要素），把痛点升级为可取证、可量化、可归因的问题
    template: problem-definition.md
    instruction: |
      调用分析工具 `problem-definition` 或按 `explore/references/problem-definition.md` 生成问题定义。

      时机：explore 阶段（可选）；不阻塞漏斗。

      必须：
      1. **8 要素**：一句话问题 / 角色场景 / 遇到的问题 / 根因 / 发生频度 / 影响范围 / 单次影响 / 累计影响。
      2. **有证据**：每条结论可回溯到 research.md 或业务数据。
      3. **可量化**：频次、成本、错误率写清基数与口径；未确证标注「待验证」。
      4. 产物：`epics/<key>/analysis/problem/problem-definition.md`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-value-stream
    optional: true
    generates: epics/<epic-key>/analysis/value-stream/value-stream.md
    description: （可选）L1 价值流与聚焦范围（As-Is），为 To-Be 与 Epic 边界提供骨架
    template: value-stream.md
    instruction: |
      调用分析工具 `value-stream-mapper` 或按 `explore/references/value-stream.md` 生成价值流图。

      时机：explore 阶段（可选）；建议复杂 Epic 在 To-Be 之前完成。

      必须：
      1. **L1 价值流 → 价值段 → 业务环节**，单客户生命周期业务通常只有 1 条主价值流。
      2. **业务纯净**：不得出现 AI / 大模型 / Agent / 具体系统名。
      3. **聚焦范围**：圈定相邻连续的聚焦环节，标注优先级。
      4. **与治理对齐**：对应 `business_process.html` 的 L1/L2。
      5. 产物：`epics/<key>/analysis/value-stream/value-stream.md`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-to-be
    optional: true
    generates: epics/<epic-key>/analysis/to-be/
    description: （可选）To-Be 流程泳道（L3→L5，人机分工 + HITL 焦点 + 异常链路）
    template: null
    instruction: |
      按 `explore/references/to-be-process.md` 设计 To-Be 流程（或调用 `to-be-process-designer` 工具）。

      时机：explore 阶段（可选）；复杂 Epic 建议做。

      必须：
      1. **列=L3 阶段，行=角色泳道，格=L5 任务**。
      2. **人机分工**：标注执行主体（人 / AI / 系统）与人工闸门。
      3. **异常链路**：主流程之外必须画失败与回退。
      4. **可追溯**：每条 To-Be 设计能对回 As-Is 痛点。
      5. 产物：`epics/<key>/analysis/to-be/`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-competitor
    optional: true
    generates: epics/<epic-key>/analysis/competitor/competitor.md
    description: （可选）竞品与参考案例，把外部实践转为照搬/改造/差异化/放弃的取舍证据
    template: null
    instruction: |
      调用分析工具 `competitor-benchmark-analyzer` 或按 `explore/references/competitor-benchmark.md` 生成对标分析。

      时机：explore 阶段（可选），建议在 prototype 之前。

      必须：
      1. **立参考点 → 双圈选样 → 取证分级 → 案例卡 → 映射取舍**。
      2. **证据分级**：A/B/C；无来源不进正文；无量化写「未披露」。
      3. **取舍回写**：每条取舍给出照搬/改造/差异化/放弃，并回写 idea 章节。
      4. 产物：`epics/<key>/analysis/competitor/competitor.md`。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: prototype
    generates: epics/<epic-key>/prototypes/<page>.html（分支 A）或 epics/<epic-key>/prototypes/working/mvp-prototype/（分支 B）
    description: 交互式 UI/UX 原型（Epic 整体，一次完成），用于前端需求验证；分支 B 为复杂业务可工作原型
    template: prototype.html
    instruction: |
      调用 `prototype` skill 为涉及 UI 的 Epic 生成原型（**Epic 整体**）。

      **时机**：在需求拆分（storymap）之前完成——有了 idea 后，先对 Epic 整体做原型设计，再拆分。

      **分支决策**：
      - **分支 A（默认，简单 UI）**：Vue 3 (CDN) + Tailwind CSS (CDN) 的交互式 HTML 原型，严格遵循 `docs/FRONTEND.md`：
        - 禁止圆角 / 阴影 / 装饰性 Emoji
        - slate 色系，1px 实线边框
        - 真实业务数据（严禁 foo/test 占位符），全中文
      - **分支 B（复杂业务）**：多角色协作 / 多流程编排 / 需真实数据交互验证的 Epic → 调用 `prototype-generator`（openspec-requirements/tools/）生成可工作原型，产物 `epics/<key>/prototypes/working/mvp-prototype/`；上游输入 = idea.md 的 To-Be 章节 + design-system tokens；启动验证（npm install + npm run dev + curl API + 浏览器逐页）为强制步骤；slate 色系/真实中文数据/禁装饰 Emoji 仍强制，圆角阴影放宽。

      **前置（产品级，可选）**：首个涉及 UI 的 Epic 前，用 `brand-design-system`（tools/）生成 `docs/baseline/design-system/`（三层 tokens + 组件规格）。

      **HITL 强制门禁**：产出后必须等待用户确认；未确认不得进入下一阶段（storymap）。涉及 UI 的 Epic 无已确认原型不得拆分/交接。
    requires:
      - explore

  - id: design-system
    optional: true
    generates: docs/baseline/design-system/{design-tokens.json,design-tokens.css,design-system.html,component-specs.md}
    description: （可选）产品级 design system（三层 tokens + 组件规格 + CSS 变量），prototype 前置
    template: null
    tool: openspec-requirements/tools/brand-design-system/SKILL.md
    instruction: |
      调用分析工具 `brand-design-system`（openspec-requirements/tools/）为产品设计 design system。

      时机：prototype 阶段前置（产品级一次生成，非单 Epic 产物）；首个涉及 UI 的 Epic 原型前执行。

      必须：
      1. **三层 token 架构**：Primitive（原始值）→ Semantic（语义别名）→ Component（组件级）。
      2. **遵循 `docs/FRONTEND.md` 极简约束**：slate 色系（slate-50/200/900）、禁止圆角（radius=0）、禁止阴影、禁止装饰性 Emoji。
      3. **输出**：`docs/baseline/design-system/design-tokens.json`（数据）+ `design-tokens.css`（CSS 变量）+ `component-specs.md`（组件规格）+ `design-system.html`（可视化审查）。
      4. **产品级**：design system 是产品资产，跨 Epic 复用，由 Baseline Sync 维护；单 Epic 原型引用其中 tokens。
      5. Slide 子系统为可选能力，仅用户明确要求演示文稿时使用。

      **HITL**：产物纳入 prototype 的 HITL 确认范围。
    requires:
      - explore

  - id: working-prototype
    optional: true
    generates: epics/<epic-key>/prototypes/working/mvp-prototype/
    description: （可选）复杂业务产品的可工作原型（前后端一体化，React/Vue + Express + Mock 服务）
    template: null
    tool: openspec-requirements/tools/prototype-generator/SKILL.md
    instruction: |
      调用分析工具 `prototype-generator`（openspec-requirements/tools/）为**复杂业务产品**生成可工作原型。

      时机：prototype 阶段的分支 B（分支 A = 简单 UI 的 Vue3+Tailwind HTML 原型）。

      触发条件（满足其一即走分支 B）：
      1. 多角色协作（B 端配置 + C 端交互）；
      2. 多流程编排（跨多个 L1/L2 流程节点）；
      3. 需要真实数据交互验证（表单→API→落库→展示闭环）。

      必须：
      1. **上游输入**：`epics/<key>/idea.md` 的 To-Be 章节 + `docs/baseline/design-system/` tokens。
      2. **UI 约束**：slate 色系（用 design-system tokens）、真实中文数据、禁装饰 Emoji；圆角/阴影规则对可工作原型放宽（组件库默认样式）。
      3. **启动验证**：`npm install && npm run dev`，curl API + 浏览器逐页验证。
      4. **产物**：`epics/<epic-key>/prototypes/working/mvp-prototype/`（含 README）。

      **HITL 强制门禁**：产出后必须等待用户确认；未确认不得进入下一阶段（storymap）。
    requires:
      - explore

  - id: arch-impact
    optional: true
    generates: epics/<epic-key>/architecture-impact.md
    description: （可选）架构影响分析（OPT），在原型后、拆分前评估 Bounded Context / Capability / 四层架构 / 数据 / 渠道 / API / 安全 / 非功能影响
    template: architecture-impact.md
    instruction: |
      调用 `arch-impact` skill 生成架构影响分析（OPT）。

      时机：原型确认之后、storymap 之前（涉及 UI 在原型后；不涉及 UI 在 explore 后）。

      必须：
      1. **Bounded Context / Capability**：受影响 BC 与 capability，新增 taxonomy 显式标注（对齐 `domain_model.html`）。
      2. **四层架构**：`HTTP → Service → Domain → Repo` 影响点，Node / Python 双端一致性。
      3. **数据与存储**：新增字段/实体、迁移兼容、FileStore/MemoryRepo 双实现。
      4. **渠道同源**：Web 与小程序是否共用账户/API/数据。
      5. **API 契约 / 安全权限 / 非功能 / 迁移演进**：逐维评估并引用真实基线节点。
      6. **对后续阶段的输入**：给出对 storymap 拆分与 handoff proposal Impact 的结论。
      7. **无影响时显式 no-op**：写明"无需架构变更"及理由，不得静默跳过。

      产物：`epics/<epic-key>/architecture-impact.md`。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（storymap）。
    requires:
      - explore

  - id: storymap
    generates: epics/<epic-key>/storymap.md
    description: 需求拆分（覆盖对账），把一个 Epic 拆成多个可独立交付的 Story
    template: storymap.md
    instruction: |
      调用 `storymap` skill 生成 storymap。

      必须：
      1. **业务主干（Jeff Patton）**：先画「阶段 → 活动 → 触点 → 用户故事（must/should/could）」，作为覆盖对账与可视化骨架（见 `storymap/references/story-map-method.md`）。
      2. **覆盖对账（强制）**：拆分前列出 Epic 承诺项（来自 idea/research 的 In Scope + Exit Criteria + 候选 Capabilities）；拆分后逐项对账，每个承诺项必须有 ≥1 个 Story 承接；有未覆盖项必须补拆或显式降级。
      3. **粒度原则**：交付 Story 仍是【完整端到端功能】（如注册含表单→校验→API→落库→自动登录），一个交付 Story 可承接多个用户故事；不拆到行为/UI 细节级。
      4. **三要素**：每个 Story 必须有人物 (Role)、价值 (Value)、目标 (Goal)。
      5. **依赖与优先级**：must→P0、should→P1、could→P2；明确依赖关系；优先垂直切片（tracer bullet）。
      6. **支撑需求**：技术/数据/合规支撑项单独列出，送交付侧，不占需求侧 Story。
      7. **治理映射对齐**：参考治理基线识别 Bounded Contexts / 流程节点 / 蓝图节点。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（story）。
    requires:
      - explore

  - id: analysis-storymap
    optional: true
    generates: epics/<epic-key>/analysis/storymap/{storymap.yaml,storymap.html}
    description: （可选）用户故事地图 4 层可视化（阶段-活动-接触点-用户故事 + MVP 优先级），storymap 的可视化补充
    template: null
    tool: openspec-requirements/tools/story-map-generator/SKILL.md
    instruction: |
      调用分析工具 `story-map-generator`（openspec-requirements/tools/）生成用户故事地图可视化。

      时机：storymap 阶段（可选增强），与 storymap.md 并行产出。

      必须：
      1. **4 层结构**：阶段 → 活动 → 接触点 → 用户故事（"作为[角色]，我想...以便..."）。
      2. **优先级标注**：must（MVP 核心）/ should / could，与 storymap.md 的 P0/P1/P2 对齐。
      3. **覆盖对账仍以 storymap.md 为准**：本工具只做可视化骨架，覆盖对账表（承诺项→承接 Story）以 storymap.md 为唯一权威。
      4. **真实数据**：拒绝空洞占位符。
      5. 产物：`epics/<key>/analysis/storymap/storymap.yaml` + `storymap.html`，storymap.md「分析制品索引」引用。

      **HITL**：产物纳入 storymap 的 HITL 确认范围。
    requires:
      - explore

  - id: story
    generates: epics/<epic-key>/stories/<story-key>/story.md
    description: 需求单元交付物（业务面）。= 一个 Story 的最终形态，作为 handoff 合成开发侧 proposal 的输入
    template: story.md
    instruction: |
      调用 `story` skill 生成需求单元交付物（业务面）。

      **命名规范**：Story ID = `story-<epic-key>-<功能>`（如 `story-account-system-register`），目录 = `stories/story-<epic-key>-<功能>/story.md`；与开发侧 change 命名（`story-<name>`）风格一致。

      **强制要求**：本交付物必须基于已确认的 `epics/<epic-key>/idea.md` 与 `epics/<epic-key>/storymap.md`。若缺失，停止并回退。

      **内容要求（纯业务面，不含行为规格）**：
        - 用户场景（C 端 + B 端视角）+ 范围。
        - 叙事五段（内嵌 story.md）：核心描述 / 角色画像 / 交互逻辑 / 验收标准 / 业务价值（见 `story/references/story-narrative.md`）。
        - 业务规则表。
        - E2E 验收标准（Given/When/Then），映射到 `business_process.html` 的 L1/L2 与 `service_blueprint.html` 的 SB-STAGE-*/SB-CUSTOMER-*。
        - 治理映射对齐（Bounded Context / L3 节点 / SB-<LANE>-*）。
        - 若涉及 UI，引用【已确认】的 Epic 整体原型 `epics/<epic-key>/prototypes/<page>.html`。
        - 业务规则或验收标准有歧义时，先用 `grilling` skill 盘问；术语不一致时用 `glossary` skill 锁定。

      **⚠️ 行为规格（Story-specs）不由本阶段生成**：行为规格（按 capability 拆分的 specs，h3/h4 格式）由开发侧在 handoff 合成 proposal 之后产出。需求侧不生成 specs/。

      **UI 门禁**：涉及 UI 的 Story，若无已确认的 Epic 整体原型，禁止勾选「待开发交接」。

      **交接**：**HITL 强制门禁**：产出后必须由用户确认验收标准；未确认禁止交接（`/req:handoff`）。交接后这是需求侧唯一冻结交付物。
    requires:
      - storymap

  - id: test-design
    generates: epics/<epic-key>/stories/<story-key>/test-design.md（或 epics/<epic-key>/test-design.md 统一设计）
    description: 测试设计（QA·分层，MUST）。把 Story E2E 验收映射为 @unit/@api/@e2e 分层用例与追溯矩阵，作为 handoff 与开发侧 spec-design 的输入
    template: test-design.md
    instruction: |
      调用 `test-design` skill 生成测试设计（MUST）。

      时机：Story 已确认之后、`/req:handoff` 之前。测试设计是交接的强制前置。

      必须：
      1. **分层遵循测试金字塔**（`docs/TESTING_STRATEGY.md`）：`@unit` ~70% / `@api` ~20% / `@e2e` ~10%；严禁把底层业务判断推给 `@e2e`。
      2. **测试用例清单**：为每个 Story E2E 场景设计正常/异常/边界用例（Case ID / 层 / 关联 Story/Scenario / Given-When-Then 摘要）。
      3. **追溯矩阵（强制）**：Story E2E 场景 → 分层用例 → 层 → 覆盖状态（✅/❌）；存在 ❌ 必须补用例或显式标注风险。
      4. **E2E 命名空间**：步骤按 Story 分文件、文本带领域/角色前缀、测试后门统一前缀（防 ambiguous）。
      5. **不做**：不写测试代码、不生成 specs/design/tasks（分别属 apply 与开发侧 spec-design）。

      产物：`epics/<epic-key>/stories/<story-key>/test-design.md`（若 Epic 统一设计则 `epics/<epic-key>/test-design.md`，并在 storymap.md 引用）。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入 handoff。
    requires:
      - story

  - id: analysis-narrative
    optional: true
    generates: epics/<epic-key>/analysis/narrative/<story-key>/narrative.md
    description: （可选）故事详述（角色画像/AC/交互逻辑/业务价值），story.md 的质量增强
    template: null
    tool: openspec-requirements/tools/story-narrative-generator/SKILL.md
    instruction: |
      调用分析工具 `story-narrative-generator`（openspec-requirements/tools/）生成故事详述。

      时机：story 阶段（可选增强），与 story.md 并行产出。

      必须：
      1. **核心描述**：细化 As-a / I-want / So-that。
      2. **角色画像**：该 Story 涉及的用户特征与痛点。
      3. **验收标准**：Given/When/Then 或列表边界条件（与 story.md 的 E2E 验收一致）。
      4. **交互逻辑**：关键 UI 元素行为与异常处理。
      5. **业务价值**：对业务指标的贡献。
      6. **不生成行为规格 specs**：本工具只是需求侧业务面详述，行为规格仍由开发侧在 proposal 后生成。
      7. 产物：`epics/<key>/analysis/narrative/<story-key>/narrative.md`，story.md「分析制品索引」引用。

      **HITL**：产物纳入 story 的 HITL 确认范围。
    requires:
      - storymap

handoff:
  requires: [story, test-design]
  instruction: |
    调用 `handoff` skill，读取 `epics/<epic-key>/stories/<story-key>/story.md`（业务面）与 `test-design.md`（分层测试设计）：
    1. 在开发侧 `openspec new change "<name>"` 创建 change。
    2. 从 Story 合成开发侧 `proposal.md`（Why ← 用户场景；What ← 范围；Capabilities ← idea 的候选 Capabilities；Process/Blueprint Alignment ← L1/L2/L3 与 SB-STAGE-*/SB-<LANE>-*；Impact ← 架构影响，优先引用 `architecture-impact.md`（若存在））。
    3. 开发侧 story 阶段跳过（业务评审已在需求侧完成，proposal 链接需求侧 story.md）。
    4. 将 `test-design.md` 作为开发侧 `spec-design` 的输入：behavior specs 的 `@unit/@api/@e2e` 标签与分层用例必须与之对齐。
    5. 若属 Epic，登记 `openspec/epic-<key>.story-list.json`（status=in_progress, changeName）。
    6. 回填需求侧交接状态。
    开发侧随后按 capability 拆分生成行为规格 specs（Story-specs）→ design → tasks → apply → verify。
    每个 change 只做 Spec Sync（K1）；Baseline Sync（K2）在 Epic 全部 Story 归档后由 /opsx:baseline/sync 统一执行。
