name: req-sdd
version: 3
description: 需求侧工作流（仅用于大块 Epic 需求） - 需求调研 (research) → 探索 (explore) → 原型 (prototype，Epic 整体) → 需求拆分 (storymap) → 需求单元交付物 (story)。规划（roadmap·每阶段多 Epic）在起点 docs/ROADMAP.md 已有，需求侧直接消费。需求侧只产出业务面 story.md；行为规格（Story-specs，按 capability 拆分的 specs）由开发侧在 handoff 合成 proposal 之后生成。Bug Fix / Tech Debt / 简单功能修改不走本流程，直接进入交付侧。
artifacts:
  - id: research
    generates: research/<epic-key>.md
    description: 需求调研（针对单个 Epic），收集需求信息（业务沟通/用户调研），含访谈原始记录
    template: research.md
    instruction: |
      调用 `research` skill 生成需求调研纪要。

      必须：
      1. **针对单个 Epic**：Epic 来自 `docs/ROADMAP.md` 的阶段条目（一句话描述）。
      2. **只负责收集**：记录 Epic 背景、调研对象、**访谈原始记录（内嵌，每条含 对象/时间方式/原始摘录/关键信号）**、原始需求信息、业务约束与规则线索、疑问待澄清项、调研结论。
      3. **访谈原始记录是内嵌组成部分**：保留一手证据（原始对话摘录），不建独立文件。
      4. **不做转化**：不转化为产品设计思路（那是 explore/idea 的职责）。
      5. **治理提示**：可初步留意候选 Bounded Contexts（不强制，explore 阶段深化）。

      该文档是 explore 的输入源，产出后需用户确认（HITL）。
    requires: []

  - id: explore
    generates: ideas/<idea-key>.md
    description: 探索（转化），把调研信息转化为产品设计思路（含 To-Be 业务设计与候选 Capabilities）
    template: idea.md
    instruction: |
      调用 `explore` skill 执行探索，产出 idea.md。

      **强制要求**：必须基于已确认的 `research/<epic-key>.md`。若缺失，停止并回退。

      必须：
      1. **澄清业务意图**：目的、范围、业务规则；B 端视角（后台配置/生命周期/权限）与 C 端视角。
      2. **To-Be Process**：目标业务流程设计（可引用 L1/L2 节点），与现状差异点。
      3. **To-Be Journey**：目标用户体验旅程（用户动作/系统反应/情绪/触点）。
      4. **产品设计思路**：业务逻辑流转与用户价值。
      5. **任务类型确认与路由**：Epic / Feature / Bug Fix / Tech Debt。
         - Bug Fix / Tech Debt / 简单功能修改 → 直走交付侧，不继续需求漏斗。
      6. **候选 Capabilities（关键）**：参考 `docs/baseline/domain_model.html` 的 BC→Capability 映射，识别新增/修改 Capability（新增标"新增 taxonomy"及理由）。这是 handoff 合成 proposal 与开发侧 specs/<capability>/ 落位的依据。
      7. **治理映射对齐**：参考 `business_process.html`（L1/L2/L3）、`service_blueprint.html`（SB-STAGE-*/SB-<LANE>-*）。
      8. **需求拆分建议 + 架构影响分析**。

      产出后需用户确认（HITL），确认后才可进入 prototype 或 storymap。
    requires:
      - research

  - id: prototype
    generates: prototypes/<epic-key>/*.html
    description: 交互式 UI/UX 原型（Epic 整体，一次完成），用于前端需求验证
    template: prototype.html
    instruction: |
      调用 `prototype` skill 为涉及 UI 的 Epic 生成交互式 HTML 原型（**Epic 整体**）。

      **时机**：在需求拆分（storymap）之前完成——有了 idea 后，先对 Epic 整体做原型设计，再拆分。

      必须严格遵循 `docs/FRONTEND.md`：
        - 禁止圆角 / 阴影 / 装饰性 Emoji
        - slate 色系，1px 实线边框
        - 真实业务数据（严禁 foo/test 占位符），全中文
        - Vue 3 (CDN) + Tailwind CSS (CDN)

      产出后必须等待用户确认（HITL），确认后方可进入 storymap。涉及 UI 的 Epic 无已确认原型不得拆分/交接。
    requires:
      - explore

  - id: storymap
    generates: storymaps/<epic-key>/storymap.md
    description: 需求拆分（覆盖对账），把一个 Epic 拆成多个可独立交付的 Story
    template: storymap.md
    instruction: |
      调用 `storymap` skill 生成 storymap。

      必须：
      1. **覆盖对账（强制）**：拆分前列出 Epic 承诺项（来自 idea/research 的 In Scope + Exit Criteria + 候选 Capabilities）；拆分后逐项对账，每个承诺项必须有 ≥1 个 Story 承接；有未覆盖项必须补拆或显式降级。
      2. **粒度原则**：每个 Story 是一个【完整端到端功能】（如注册含表单→校验→API→落库→自动登录），不拆到行为/UI 细节级，避免破坏上下文。
      3. **三要素**：每个 Story 必须有人物 (Role)、价值 (Value)、目标 (Goal)。
      4. **依赖与优先级**：明确各 Story 依赖关系与 P0/P1/P2 优先级。
      5. **治理映射对齐**：参考治理基线识别 Bounded Contexts / 流程节点 / 蓝图节点。

      产出后需用户确认（HITL），确认每个 Story 可进入 story。
    requires:
      - explore

  - id: story
    generates: stories/<story-key>/story.md
    description: 需求单元交付物（业务面）。= 一个 Story 的最终形态，作为 handoff 合成开发侧 proposal 的输入
    template: story.md
    instruction: |
      调用 `story` skill 生成需求单元交付物（业务面）。

      **强制要求**：本交付物必须基于已确认的 `ideas/<idea-key>.md` 与 `storymaps/<epic-key>/storymap.md`。若缺失，停止并回退。

      **内容要求（纯业务面，不含行为规格）**：
        - 用户场景（C 端 + B 端视角）+ 范围。
        - 业务规则表。
        - E2E 验收标准（Given/When/Then），映射到 `business_process.html` 的 L1/L2 与 `service_blueprint.html` 的 SB-STAGE-*/SB-CUSTOMER-*。
        - 治理映射对齐（Bounded Context / L3 节点 / SB-<LANE>-*）。
        - 若涉及 UI，引用【已确认】的 Epic 整体原型 `prototypes/<epic-key>/<capability>.html`。

      **⚠️ 行为规格（Story-specs）不由本阶段生成**：行为规格（按 capability 拆分的 specs，h3/h4 格式）由开发侧在 handoff 合成 proposal 之后产出。需求侧不生成 specs/。

      **UI 门禁**：涉及 UI 的 Story，若无已确认的 Epic 整体原型，禁止勾选「待开发交接」。

      **交接**：产出后通过 `/req:handoff`（skill: handoff）交给开发侧，这是需求侧唯一冻结交付物。
    requires:
      - storymap

handoff:
  requires: [story]
  instruction: |
    调用 `handoff` skill，读取 `stories/<story-key>/story.md`（业务面）：
    1. 在开发侧 `openspec new change "<name>"` 创建 change。
    2. 从 Story 合成开发侧 `proposal.md`（Why ← 用户场景；What ← 范围；Capabilities ← idea 的候选 Capabilities；Process/Blueprint Alignment ← L1/L2/L3 与 SB-STAGE-*/SB-<LANE>-*；Impact ← 架构影响）。
    3. 开发侧 story 阶段跳过（业务评审已在需求侧完成，proposal 链接需求侧 story.md）。
    4. 若属 Epic，登记 `openspec/epic-<key>.story-list.json`（status=in_progress, changeName）。
    5. 回填需求侧交接状态。
    开发侧随后按 capability 拆分生成行为规格 specs（Story-specs）→ design → tasks → apply → verify。
    每个 change 只做 Spec Sync（K1）；Baseline Sync（K2）在 Epic 全部 Story 归档后由 /opsx:baseline/sync 统一执行。
