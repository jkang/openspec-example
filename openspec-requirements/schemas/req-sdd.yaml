name: req-sdd
version: 5
description: 需求侧工作流（仅用于大块 Epic 需求） - 需求调研 (research) → 探索 (explore) → 原型 (prototype，Epic 整体) → 需求拆分 (storymap) → 需求单元交付物 (story)。规划（roadmap·每阶段多 Epic）在起点 docs/ROADMAP.md 已有，需求侧直接消费。需求侧只产出业务面 story.md；行为规格（Story-specs，按 capability 拆分的 specs）由开发侧在 handoff 合成 proposal 之后生成。Bug Fix / Tech Debt / 简单功能修改不走本流程，直接进入交付侧。
analysis:
  description: 需求分析工具箱（可选增强） - openspec-requirements/tools/ 下的 8 个 AI4PM 需求工程工具，为 explore/prototype/storymap/story 阶段提供可选的结构化分析与可视化产物。所有分析制品均为 optional，缺省不影响原漏斗 HITL 门禁。
  tools_path: openspec-requirements/tools/
  tool_map:
    osm: osm-map-generator
    process: business-process-deep-analyzer
    journey: journey-map-generator
    blueprint: blueprint-map-generator
    design-system: brand-design-system
    working-prototype: prototype-generator
    storymap-visual: story-map-generator
    narrative: story-narrative-generator
artifacts:
  - id: research
    generates: epics/<epic-key>/research.md
    description: 需求调研（针对单个 Epic），收集需求信息（业务沟通/用户调研），含访谈原始记录
    template: research.md
    instruction: |
      调用 `research` skill 生成需求调研纪要。

      必须：
      1. **针对单个 Epic**：Epic 来自 `docs/ROADMAP.md` 的阶段条目（一句话描述）。
      2. **只负责收集**：记录 Epic 背景、调研对象、**访谈原始记录（内嵌，每条含 对象/时间方式/原始摘录/关键信号）**、原始需求信息、业务约束与规则线索、疑问待澄清项、调研结论。
      3. **访谈原始记录是内嵌组成部分**：保留一手证据（原始对话摘录），不建独立文件。
      4. **不做转化**：不转化为产品设计思路（那是 explore/idea 的职责）。
      5. **治理提示**：可初步留意候选 Bounded Contexts（不强制，explore 阶段深化）。

      该文档是 explore 的输入源。**HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（explore）。
    requires: []

  - id: explore
    generates: epics/<epic-key>/idea.md
    description: 探索（转化），把调研信息转化为产品设计思路（含 To-Be 业务设计与候选 Capabilities）
    template: idea.md
    instruction: |
      调用 `explore` skill 执行探索，产出 idea.md。

      **强制要求**：必须基于已确认的 `epics/<epic-key>/research.md`。若缺失，停止并回退。

      必须：
      1. **澄清业务意图**：目的、范围、业务规则；B 端视角（后台配置/生命周期/权限）与 C 端视角。
      2. **To-Be Process**：目标业务流程设计（可引用 L1/L2 节点），与现状差异点。
      3. **To-Be Journey**：目标用户体验旅程（用户动作/系统反应/情绪/触点）。
      4. **产品设计思路**：业务逻辑流转与用户价值。
      5. **任务类型确认与路由**：Epic / Feature / Bug Fix / Tech Debt。
         - Bug Fix / Tech Debt / 简单功能修改 → 直走交付侧，不继续需求漏斗。
      6. **候选 Capabilities（关键）**：参考 `docs/baseline/domain_model.html` 的 BC→Capability 映射，识别新增/修改 Capability（新增标"新增 taxonomy"及理由）。这是 handoff 合成 proposal 与开发侧 specs/<capability>/ 落位的依据。
      7. **治理映射对齐**：参考 `business_process.html`（L1/L2/L3）、`service_blueprint.html`（SB-STAGE-*/SB-<LANE>-*）。
      8. **需求拆分建议 + 架构影响分析**。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（prototype/storymap）。
    requires:
      - research

  - id: analysis-osm
    optional: true
    generates: epics/<epic-key>/analysis/osm/{osm.yaml,osm.html}
    description: （可选）Epic 目标-策略-度量（OSM），为 Exit Criteria 提供可度量指标锚点
    template: null
    tool: openspec-requirements/tools/osm-map-generator/SKILL.md
    instruction: |
      调用分析工具 `osm-map-generator`（openspec-requirements/tools/）生成 Epic 的 OSM 地图（Objective → Strategy → Metric）。

      时机：explore 阶段（可选增强），在产出 idea.md 后对 Epic 整体目标做度量分解。

      必须：
      1. **Objective**：对齐 ROADMAP 阶段条目与 idea 的业务意图，定义 1 个主目标。
      2. **Strategy**：拆出 2-4 条达成策略。
      3. **Metric**：每个策略给出可量化指标（含当前值/目标值），作为 storymap 覆盖对账与开发侧 Exit Criteria 的度量锚点。
      4. **真实数据**：拒绝空洞占位符，指标须为真实业务量级。
      5. 产物：`epics/<key>/analysis/osm/osm.yaml` + `osm.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-process
    optional: true
    generates: epics/<epic-key>/analysis/process/{process.yaml,process.html}
    description: （可选）To-Be Process 深度分析（L1/L2 + 痛点热力），升级 idea 的纯文本流程
    template: null
    tool: openspec-requirements/tools/business-process-deep-analyzer/SKILL.md
    instruction: |
      调用分析工具 `business-process-deep-analyzer`（openspec-requirements/tools/）生成 To-Be Process 可视化。

      时机：explore 阶段（可选增强），与 idea.md 的 To-Be Process 章节并行产出。

      必须：
      1. **业务类型分型**：业务模式/产品类型/市场类型。
      2. **L1 价值流**：端到端价值流阶段（与 business_process.html 的 L1 口径对齐）。
      3. **L2 流程**：每阶段展开活动/角色/系统/输入输出/业务规则。
      4. **痛点**：标注 critical/high/medium/low，含根因分析。
      5. **真实数据**：拒绝空洞占位符。
      6. 产物：`epics/<key>/analysis/process/process.yaml` + `process.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: analysis-journey
    optional: true
    generates: epics/<epic-key>/analysis/journey/{journey.yaml,journey.html}
    description: （可选）To-Be Journey 可视化（阶段/行为/触点/情绪/痛点），升级 idea 的纯文本旅程
    template: null
    tool: openspec-requirements/tools/journey-map-generator/SKILL.md
    instruction: |
      调用分析工具 `journey-map-generator`（openspec-requirements/tools/）生成 To-Be Journey 可视化。

      时机：explore 阶段（可选增强），与 idea.md 的 To-Be Journey 章节并行产出。

      必须：
      1. **mode: to-be**：目标旅程设计（非现状诊断）。
      2. **阶段**：≥3 个旅程阶段；每阶段 1-3 个核心用户动作。
      3. **维度**：每个动作含 触点 / 情绪体验分(1-10) / 想法 / 痛点或期望改善。
      4. **真实数据**：拒绝空洞占位符，使用真实业务场景。
      5. 产物：`epics/<key>/analysis/journey/journey.yaml` + `journey.html`，idea.md「分析制品索引」引用。

      **HITL**：产物纳入 explore 的 HITL 确认范围。
    requires:
      - research

  - id: prototype
    generates: epics/<epic-key>/prototypes/<page>.html（分支 A）或 epics/<epic-key>/prototypes/working/mvp-prototype/（分支 B）
    description: 交互式 UI/UX 原型（Epic 整体，一次完成），用于前端需求验证；分支 B 为复杂业务可工作原型
    template: prototype.html
    instruction: |
      调用 `prototype` skill 为涉及 UI 的 Epic 生成原型（**Epic 整体**）。

      **时机**：在需求拆分（storymap）之前完成——有了 idea 后，先对 Epic 整体做原型设计，再拆分。

      **分支决策**：
      - **分支 A（默认，简单 UI）**：Vue 3 (CDN) + Tailwind CSS (CDN) 的交互式 HTML 原型，严格遵循 `docs/FRONTEND.md`：
        - 禁止圆角 / 阴影 / 装饰性 Emoji
        - slate 色系，1px 实线边框
        - 真实业务数据（严禁 foo/test 占位符），全中文
      - **分支 B（复杂业务）**：多角色协作 / 多流程编排 / 需真实数据交互验证的 Epic → 调用 `prototype-generator`（openspec-requirements/tools/）生成可工作原型，产物 `epics/<key>/prototypes/working/mvp-prototype/`；上游输入 = idea.md 的 To-Be 章节 + design-system tokens；启动验证（npm install + npm run dev + curl API + 浏览器逐页）为强制步骤；slate 色系/真实中文数据/禁装饰 Emoji 仍强制，圆角阴影放宽。

      **前置（产品级，可选）**：首个涉及 UI 的 Epic 前，用 `brand-design-system`（tools/）生成 `docs/baseline/design-system/`（三层 tokens + 组件规格）。

      **HITL 强制门禁**：产出后必须等待用户确认；未确认不得进入下一阶段（storymap）。涉及 UI 的 Epic 无已确认原型不得拆分/交接。
    requires:
      - explore

  - id: design-system
    optional: true
    generates: docs/baseline/design-system/{design-tokens.json,design-tokens.css,design-system.html,component-specs.md}
    description: （可选）产品级 design system（三层 tokens + 组件规格 + CSS 变量），prototype 前置
    template: null
    tool: openspec-requirements/tools/brand-design-system/SKILL.md
    instruction: |
      调用分析工具 `brand-design-system`（openspec-requirements/tools/）为产品设计 design system。

      时机：prototype 阶段前置（产品级一次生成，非单 Epic 产物）；首个涉及 UI 的 Epic 原型前执行。

      必须：
      1. **三层 token 架构**：Primitive（原始值）→ Semantic（语义别名）→ Component（组件级）。
      2. **遵循 `docs/FRONTEND.md` 极简约束**：slate 色系（slate-50/200/900）、禁止圆角（radius=0）、禁止阴影、禁止装饰性 Emoji。
      3. **输出**：`docs/baseline/design-system/design-tokens.json`（数据）+ `design-tokens.css`（CSS 变量）+ `component-specs.md`（组件规格）+ `design-system.html`（可视化审查）。
      4. **产品级**：design system 是产品资产，跨 Epic 复用，由 Baseline Sync 维护；单 Epic 原型引用其中 tokens。
      5. Slide 子系统为可选能力，仅用户明确要求演示文稿时使用。

      **HITL**：产物纳入 prototype 的 HITL 确认范围。
    requires:
      - explore

  - id: working-prototype
    optional: true
    generates: epics/<epic-key>/prototypes/working/mvp-prototype/
    description: （可选）复杂业务产品的可工作原型（前后端一体化，React/Vue + Express + Mock 服务）
    template: null
    tool: openspec-requirements/tools/prototype-generator/SKILL.md
    instruction: |
      调用分析工具 `prototype-generator`（openspec-requirements/tools/）为**复杂业务产品**生成可工作原型。

      时机：prototype 阶段的分支 B（分支 A = 简单 UI 的 Vue3+Tailwind HTML 原型）。

      触发条件（满足其一即走分支 B）：
      1. 多角色协作（B 端配置 + C 端交互）；
      2. 多流程编排（跨多个 L1/L2 流程节点）；
      3. 需要真实数据交互验证（表单→API→落库→展示闭环）。

      必须：
      1. **上游输入**：`epics/<key>/idea.md` 的 To-Be 章节 + `docs/baseline/design-system/` tokens。
      2. **UI 约束**：slate 色系（用 design-system tokens）、真实中文数据、禁装饰 Emoji；圆角/阴影规则对可工作原型放宽（组件库默认样式）。
      3. **启动验证**：`npm install && npm run dev`，curl API + 浏览器逐页验证。
      4. **产物**：`epics/<epic-key>/prototypes/working/mvp-prototype/`（含 README）。

      **HITL 强制门禁**：产出后必须等待用户确认；未确认不得进入下一阶段（storymap）。
    requires:
      - explore

  - id: storymap
    generates: epics/<epic-key>/storymap.md
    description: 需求拆分（覆盖对账），把一个 Epic 拆成多个可独立交付的 Story
    template: storymap.md
    instruction: |
      调用 `storymap` skill 生成 storymap。

      必须：
      1. **覆盖对账（强制）**：拆分前列出 Epic 承诺项（来自 idea/research 的 In Scope + Exit Criteria + 候选 Capabilities）；拆分后逐项对账，每个承诺项必须有 ≥1 个 Story 承接；有未覆盖项必须补拆或显式降级。
      2. **粒度原则**：每个 Story 是一个【完整端到端功能】（如注册含表单→校验→API→落库→自动登录），不拆到行为/UI 细节级，避免破坏上下文。
      3. **三要素**：每个 Story 必须有人物 (Role)、价值 (Value)、目标 (Goal)。
      4. **依赖与优先级**：明确各 Story 依赖关系与 P0/P1/P2 优先级。
      5. **治理映射对齐**：参考治理基线识别 Bounded Contexts / 流程节点 / 蓝图节点。

      **HITL 强制门禁**：产出后必须暂停征求用户确认；未确认不得进入下一阶段（story）。
    requires:
      - explore

  - id: analysis-storymap
    optional: true
    generates: epics/<epic-key>/analysis/storymap/{storymap.yaml,storymap.html}
    description: （可选）用户故事地图 4 层可视化（阶段-活动-接触点-用户故事 + MVP 优先级），storymap 的可视化补充
    template: null
    tool: openspec-requirements/tools/story-map-generator/SKILL.md
    instruction: |
      调用分析工具 `story-map-generator`（openspec-requirements/tools/）生成用户故事地图可视化。

      时机：storymap 阶段（可选增强），与 storymap.md 并行产出。

      必须：
      1. **4 层结构**：阶段 → 活动 → 接触点 → 用户故事（"作为[角色]，我想...以便..."）。
      2. **优先级标注**：must（MVP 核心）/ should / could，与 storymap.md 的 P0/P1/P2 对齐。
      3. **覆盖对账仍以 storymap.md 为准**：本工具只做可视化骨架，覆盖对账表（承诺项→承接 Story）以 storymap.md 为唯一权威。
      4. **真实数据**：拒绝空洞占位符。
      5. 产物：`epics/<key>/analysis/storymap/storymap.yaml` + `storymap.html`，storymap.md「分析制品索引」引用。

      **HITL**：产物纳入 storymap 的 HITL 确认范围。
    requires:
      - explore

  - id: story
    generates: epics/<epic-key>/stories/<story-key>/story.md
    description: 需求单元交付物（业务面）。= 一个 Story 的最终形态，作为 handoff 合成开发侧 proposal 的输入
    template: story.md
    instruction: |
      调用 `story` skill 生成需求单元交付物（业务面）。

      **命名规范**：Story ID = `story-<epic-key>-<功能>`（如 `story-account-system-register`），目录 = `stories/story-<epic-key>-<功能>/story.md`；与开发侧 change 命名（`story-<name>`）风格一致。

      **强制要求**：本交付物必须基于已确认的 `epics/<epic-key>/idea.md` 与 `epics/<epic-key>/storymap.md`。若缺失，停止并回退。

      **内容要求（纯业务面，不含行为规格）**：
        - 用户场景（C 端 + B 端视角）+ 范围。
        - 业务规则表。
        - E2E 验收标准（Given/When/Then），映射到 `business_process.html` 的 L1/L2 与 `service_blueprint.html` 的 SB-STAGE-*/SB-CUSTOMER-*。
        - 治理映射对齐（Bounded Context / L3 节点 / SB-<LANE>-*）。
        - 若涉及 UI，引用【已确认】的 Epic 整体原型 `epics/<epic-key>/prototypes/<page>.html`。

      **⚠️ 行为规格（Story-specs）不由本阶段生成**：行为规格（按 capability 拆分的 specs，h3/h4 格式）由开发侧在 handoff 合成 proposal 之后产出。需求侧不生成 specs/。

      **UI 门禁**：涉及 UI 的 Story，若无已确认的 Epic 整体原型，禁止勾选「待开发交接」。

      **交接**：**HITL 强制门禁**：产出后必须由用户确认验收标准；未确认禁止交接（`/req:handoff`）。交接后这是需求侧唯一冻结交付物。
    requires:
      - storymap

  - id: analysis-narrative
    optional: true
    generates: epics/<epic-key>/analysis/narrative/<story-key>/narrative.md
    description: （可选）故事详述（角色画像/AC/交互逻辑/业务价值），story.md 的质量增强
    template: null
    tool: openspec-requirements/tools/story-narrative-generator/SKILL.md
    instruction: |
      调用分析工具 `story-narrative-generator`（openspec-requirements/tools/）生成故事详述。

      时机：story 阶段（可选增强），与 story.md 并行产出。

      必须：
      1. **核心描述**：细化 As-a / I-want / So-that。
      2. **角色画像**：该 Story 涉及的用户特征与痛点。
      3. **验收标准**：Given/When/Then 或列表边界条件（与 story.md 的 E2E 验收一致）。
      4. **交互逻辑**：关键 UI 元素行为与异常处理。
      5. **业务价值**：对业务指标的贡献。
      6. **不生成行为规格 specs**：本工具只是需求侧业务面详述，行为规格仍由开发侧在 proposal 后生成。
      7. 产物：`epics/<key>/analysis/narrative/<story-key>/narrative.md`，story.md「分析制品索引」引用。

      **HITL**：产物纳入 story 的 HITL 确认范围。
    requires:
      - storymap

handoff:
  requires: [story]
  instruction: |
    调用 `handoff` skill，读取 `epics/<epic-key>/stories/<story-key>/story.md`（业务面）：
    1. 在开发侧 `openspec new change "<name>"` 创建 change。
    2. 从 Story 合成开发侧 `proposal.md`（Why ← 用户场景；What ← 范围；Capabilities ← idea 的候选 Capabilities；Process/Blueprint Alignment ← L1/L2/L3 与 SB-STAGE-*/SB-<LANE>-*；Impact ← 架构影响）。
    3. 开发侧 story 阶段跳过（业务评审已在需求侧完成，proposal 链接需求侧 story.md）。
    4. 若属 Epic，登记 `openspec/epic-<key>.story-list.json`（status=in_progress, changeName）。
    5. 回填需求侧交接状态。
    开发侧随后按 capability 拆分生成行为规格 specs（Story-specs）→ design → tasks → apply → verify。
    每个 change 只做 Spec Sync（K1）；Baseline Sync（K2）在 Epic 全部 Story 归档后由 /opsx:baseline/sync 统一执行。
